<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080812">
<meta name="description" content="Confira a identidade digital, os links e o universo gamer de um membro do isly.me.">
<title id="pageTitle">isly.me — Perfil</title>

<!-- SDK Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  if (typeof supabase === 'undefined') {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
  }
</script>

<!-- Integração ISLY.ME -->
<script src="/js/supabase.js"></script>

<style>
:root{
  color-scheme:dark;
  --bg:#080812;
  --panel:#11111f;
  --line:#292944;
  --text:#f6f4ff;
  --muted:#a6a4c4;
  --purple:#a855f7;
  --blue:#22d3ee;
  --pink:#f472b6;
  --green:#86efac
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at 50% -20%,rgba(124,58,237,.22),transparent 45%),var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:grid;
  place-items:center;
  padding:20px
}
a{color:inherit;text-decoration:none}
.container{width:100%;max-width:420px}

.profile-card{
  overflow:hidden;
  border:1px solid #49406c;
  border-radius:22px;
  background:linear-gradient(155deg,#19172b,#0e0e1b 75%);
  box-shadow:0 18px 60px #0006;
  --accent:#c084fc;
  background-size:cover;
  background-position:center
}
.profile-card.theme-sakura{--accent:#f9a8d4;border-color:#734467}
.profile-card.theme-matrix{--accent:#86efac;border-color:#356b55}

/* ESTILOS DE ALINHAMENTO */
.profile-card.align-center { text-align: center; }
.profile-card.align-center .avatar { margin: -38px auto 10px; }
.profile-card.align-center .live-status { margin: 0 auto 14px; }
.profile-card.align-center .preview-emblems { justify-content: center; }
.profile-card.align-center .social-preview { justify-content: center; }

.profile-card.align-left { text-align: left; }
.profile-card.align-left .avatar { margin: -38px 0 10px 18px; }
.profile-card.align-left h3,
.profile-card.align-left .handle,
.profile-card.align-left div:has(#roleBadge),
.profile-card.align-left .bio-preview { padding-left: 18px; padding-right: 18px; }
.profile-card.align-left .live-status { margin: 0 0 14px 18px; }
.profile-card.align-left .preview-emblems { justify-content: flex-start; padding-left: 18px; }
.profile-card.align-left .social-preview { justify-content: flex-start; padding-left: 18px; }
.profile-card.align-left .public-links { padding-left: 14px; padding-right: 14px; }

.cover{
  height:88px;
  position:relative;
  background:radial-gradient(circle at 75% 20%,#22d3ee88,transparent 27%),radial-gradient(circle at 22% 100%,#c084fcaa,transparent 42%),linear-gradient(120deg,#25104a,#13152d);
  background-size:cover;
  background-position:center
}
.theme-sakura .cover{background:radial-gradient(circle at 75% 20%,#f472b688,transparent 30%),linear-gradient(120deg,#461b43,#1c1631)}
.theme-matrix .cover{background:radial-gradient(circle at 75% 20%,#4ade8088,transparent 30%),linear-gradient(120deg,#10392d,#101923)}

.avatar{
  width:76px;
  height:76px;
  position:relative;
  display:grid;
  place-items:center;
  border:3px solid #151426;
  border-radius:24px;
  background:linear-gradient(135deg,#9333ea,#2563eb);
  box-shadow:0 0 30px #9333ea55;
  font-size:30px;
  overflow:hidden
}
.avatar img{width:100%;height:100%;object-fit:cover}

.profile-card h3{margin:7px 0 1px;font-size:20px;overflow-wrap:anywhere}
.verified{color:var(--blue);font-size:12px}
.handle{font-size:11px;color:var(--accent);overflow-wrap:anywhere}

.role-badge{
  display:inline-block;
  margin:6px 0 4px;
  font-size:10px;
  font-weight:700;
  padding:3px 10px;
  border-radius:99px;
  background:#8b5cf620;
  border:1px solid #8b5cf650;
  color:#c084fc
}
.bio-preview{
  font-size:11px;
  color:#aaa7c7;
  margin:10px 18px 12px;
  overflow-wrap:anywhere;
  white-space:pre-wrap
}
.live-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border:1px solid #22d3ee45;
  background:#22d3ee0d;
  color:#cffafe;
  border-radius:999px;
  font-size:10px;
  max-width:90%;
  overflow-wrap:anywhere
}
.preview-emblems{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  padding:0 14px 13px
}
.preview-emblems span{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 7px;
  border:1px solid #a855f733;
  background:#a855f70d;
  border-radius:7px;
  font-size:9px;
  color:#ddd6fe
}
.social-preview{display:flex;gap:7px;margin:0 0 14px}
.social-preview span{
  display:grid;
  place-items:center;
  width:27px;
  height:27px;
  border:1px solid #34314d;
  border-radius:8px;
  color:var(--accent);
  font-size:11px
}
.public-links{padding:0 14px 18px}
.public-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:8px;
  padding:12px 14px;
  border:1px solid #39324f;
  border-radius:11px;
  background:linear-gradient(100deg,#ffffff08,#ffffff03);
  font-size:11px;
  font-weight:700;
  text-align:left;
  color:#fff;
  transition:.2s
}
.public-link:hover{border-color:var(--accent);transform:translateY(-1px)}
.public-link .left{display:flex;align-items:center;gap:10px;min-width:0}
.public-link .left .link-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.public-link .arr{color:var(--accent);flex-shrink:0}
.profile-foot{
  font-size:9px;
  color:#777391;
  letter-spacing:.13em;
  padding:16px 0;
  text-align:center
}
.profile-foot a:hover{color:var(--blue)}
.error-box{
  text-align:center;
  padding:30px 22px;
  color:#fcd9a1;
  border:1px solid #49406c;
  border-radius:22px;
  background:linear-gradient(155deg,#19172b,#0e0e1b 75%);
  overflow-wrap:anywhere
}
.error-box h2{font-size:19px}
.error-box p{font-size:13px;color:var(--muted);line-height:1.7}
.error-box a{display:inline-block;margin-top:12px;color:#c084fc}
.loading{color:var(--muted);text-align:center;padding:30px}

/* --- ESTILOS DO BOTÃO HYPE & VIEWS (MÉTRICAS) --- */
.stats-container {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px 14px;
  width: 100%;
}
.profile-card.align-center .stats-container { justify-content: center; }
.profile-card.align-left .stats-container { justify-content: flex-start; }

.views-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 999px;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  backdrop-filter: blur(12px);
}

.hype-button {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 8px 22px 8px 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
  transition: transform 0.15s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}

.hype-button:hover {
  transform: scale(1.03);
  border-color: rgba(255, 255, 255, 0.5);
  box-shadow: 0 0 18px rgba(255, 255, 255, 0.2);
}

.hype-button:active {
  transform: scale(0.95);
}

.hype-button.hyped {
  animation: flashGlow 0.4s ease-out;
}

@keyframes flashGlow {
  0% {
    box-shadow: 0 0 35px rgba(255, 255, 255, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.4);
    border-color: #ffffff;
  }
  100% {
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
  }
}

.icon-wrapper {
  position: relative;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.02);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.08);
}

.neon-star {
  fill: #FFFFFF;
  stroke: #FFFFFF;
  stroke-width: 2.5;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  transform: rotate(0deg) scale(1);
}

.hyped .neon-star {
  transform: rotate(0deg) scale(1.25);
  filter: drop-shadow(0 0 12px rgba(255, 255, 255, 1));
}

.hype-count {
  color: #ffffff;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
  transition: transform 0.15s ease;
}

.hyped .hype-count {
  transform: scale(1.15);
}

/* Partículas Neon (Confetes) */
.particle {
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 8px #ffffff, 0 0 14px rgba(255, 255, 255, 0.8);
  animation: explode 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}

@keyframes explode {
  0% {
    opacity: 1;
    transform: translate(0, 0) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate(var(--tx), var(--ty)) scale(0);
  }
}
</style>
</head>

<body>
<main class="container" id="profileContainer">
  <div class="profile-card align-center" id="profileCard">
    <div class="cover" id="cover"></div>
    <div class="avatar" id="avatar" aria-label="Avatar do perfil">👾</div>
    <h3 id="name">Carregando...</h3>
    <div class="handle" id="handle">@...</div>
    <div class="role-badge" id="roleBadge">👾 Membro</div>
    <p class="bio-preview" id="bio"></p>
    <div class="live-status" id="statusBox">
      <span id="statusEmoji">🎮</span>
      <span id="statusText">Buscando universo...</span>
    </div>
    <div class="preview-emblems" id="emblems"></div>
    <div class="social-preview" aria-label="Universo gamer">
      <span>◎</span><span>▶</span><span>⌘</span><span>◈</span>
    </div>

    <!-- Container unificado: Contador de Visualizações + Botão Hype (Estrela Neon) -->
    <div class="stats-container" id="statsContainer">
      <div class="views-badge">
        <span>👀</span>
        <span id="viewsCount">0</span> views
      </div>

      <div class="hype-button" id="hypeBtn">
        <div class="icon-wrapper" id="iconWrapper">
          <svg width="26" height="26" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="neon-star">
            <path d="M24 10L26.7634 19.4674L33.7128 20.1456L28.4724 24.8454L30.043 31.6786L24 28.02L17.957 31.6786L19.5276 24.8454L14.2872 20.1456L21.2366 19.4674L24 10Z" />
          </svg>
        </div>
        <span class="hype-count" id="hypeCount">0</span>
      </div>
    </div>

    <div class="public-links" id="links"></div>
    <div id="guestbookSection" style="display:none; padding:0 14px 14px;"></div>
    <div class="profile-foot">
      <a href="/landing.html">CRIADO NO ISLY.ME ✦</a>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';

  const emblemInfo = {
    gamer: { emoji: '🎮', name: 'Gamer' },
    geek: { emoji: '👾', name: 'Geek' },
    rpg: { emoji: '🐉', name: 'Mestre do RPG' },
    anime: { emoji: '🍥', name: 'Anime lover' },
    artist: { emoji: '🎨', name: 'Criador' },
    founder: { emoji: '💎', name: 'Fundador' }
  };

  function showError(title, message, showHomeLink) {
    const container = document.getElementById('profileContainer');
    container.replaceChildren();

    const box = document.createElement('section');
    box.className = 'error-box';

    const heading = document.createElement('h2');
    heading.textContent = title;

    const paragraph = document.createElement('p');
    paragraph.textContent = message;

    box.append(heading, paragraph);

    if (showHomeLink) {
      const link = document.createElement('a');
      link.href = '/landing.html';
      link.textContent = 'Voltar ao ISLY.ME';
      box.appendChild(link);
    }

    container.appendChild(box);
  }

  function safeWebUrl(value) {
    if (typeof value !== 'string') return null;

    const trimmed = value.trim();
    if (!trimmed) return null;

    try {
      const url = new URL(trimmed);
      if (url.protocol !== 'https:' && url.protocol !== 'http:') {
        return null;
      }
      return url.href;
    } catch (_) {
      return null;
    }
  }

  function setAvatar(data) {
    const avatar = document.getElementById('avatar');
    const imageUrl = safeWebUrl(data.avatar_url);

    avatar.replaceChildren();

    if (imageUrl) {
      const img = document.createElement('img');
      img.src = imageUrl;
      img.alt = 'Avatar de ' + (data.name || data.handle || 'usuário');
      img.loading = 'lazy';

      img.addEventListener('error', function () {
        avatar.textContent = data.avatar_emoji || '👾';
      }, { once: true });

      avatar.appendChild(img);
    } else {
      avatar.textContent = data.avatar_emoji || '👾';
    }
  }

  function renderEmblems(value) {
    const container = document.getElementById('emblems');
    container.replaceChildren();

    let emblems = value;

    if (typeof emblems === 'string') {
      try {
        emblems = JSON.parse(emblems);
      } catch (_) {
        emblems = [];
      }
    }

    if (!Array.isArray(emblems)) return;

    emblems.forEach(function (id) {
      const info = emblemInfo[id];
      if (!info) return;

      const badge = document.createElement('span');
      badge.textContent = info.emoji + ' ' + info.name;
      container.appendChild(badge);
    });
  }

  function renderLinks(value) {
    const container = document.getElementById('links');
    container.replaceChildren();

    let links = value;

    if (typeof links === 'string') {
      try {
        links = JSON.parse(links);
      } catch (_) {
        links = [];
      }
    }

    if (!Array.isArray(links)) return;

    links.forEach(function (item) {
      if (!item || typeof item !== 'object') return;

      const url = safeWebUrl(item.url);
      if (!url) return;

      const anchor = document.createElement('a');
      anchor.className = 'public-link';
      anchor.href = url;
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer';

      const left = document.createElement('span');
      left.className = 'left';

      const emoji = document.createElement('span');
      emoji.textContent = typeof item.emoji === 'string' ? item.emoji : '↗';

      const title = document.createElement('span');
      title.className = 'link-title';
      title.textContent = typeof item.title === 'string' && item.title.trim()
        ? item.title.trim()
        : 'Link';

      const arrow = document.createElement('span');
      arrow.className = 'arr';
      arrow.textContent = '↗';

      left.append(emoji, title);
      anchor.append(left, arrow);
      container.appendChild(anchor);
    });
  }

  function renderProfile(data, requestedHandle) {
    const name = data.name || requestedHandle || 'Usuário';
    const handle = data.handle || requestedHandle;

    document.title = name + ' — isly.me';

    const heading = document.getElementById('name');
    heading.replaceChildren();

    const nameText = document.createElement('span');
    nameText.textContent = name;

    const verified = document.createElement('span');
    verified.className = 'verified';
    verified.textContent = ' ✦';

    heading.append(nameText, verified);

    document.getElementById('handle').textContent = '@' + handle;
    document.getElementById('bio').textContent = data.bio || '';
    document.getElementById('statusEmoji').textContent = data.status_emoji || '🎮';

    const statusParts = [
      data.status_label || 'Jogando',
      data.activity || ''
    ].filter(Boolean);

    document.getElementById('statusText').textContent = statusParts.join(' · ');

    const roleBadge = document.getElementById('roleBadge');
    const role = String(data.role || 'Membro').toLowerCase();

    const roles = {
      'fundador': '💎 Fundador',
      'founder': '💎 Fundador',
      'suporte': '🛡️ Suporte',
      'apoiador': '⭐ Apoiador',
      'membro': '👾 Membro'
    };

    roleBadge.textContent = roles[role] || '👾 ' + (data.role || 'Membro');

    setAvatar(data);
    renderEmblems(data.emblems);
    renderLinks(data.links);

    // Carrega contadores (Views e Hypes se houver na base)
    if (document.getElementById('viewsCount')) {
      document.getElementById('viewsCount').textContent = data.views || 0;
    }
    if (document.getElementById('hypeCount')) {
      document.getElementById('hypeCount').textContent = data.hypes || 0;
    }

    // Banner e Wallpaper personalizados com segurança
    const cover = document.getElementById('cover');
    if (cover && data.banner_url) {
      cover.style.backgroundImage = `url('${data.banner_url}')`;
    }

    const card = document.getElementById('profileCard');
    
    // Aplicação do Alinhamento do Card (center ou left)
    const alignment = data.card_alignment || 'center';
    card.classList.remove('align-center', 'align-left');
    card.classList.add('align-' + alignment);

    card.classList.remove('theme-sakura', 'theme-matrix');
    if (data.theme === 'sakura') {
      card.classList.add('theme-sakura');
    } else if (data.theme === 'matrix') {
      card.classList.add('theme-matrix');
    }

    if (data.wallpaper_url) {
      card.style.backgroundImage = `url('${data.wallpaper_url}')`;
      card.style.backgroundSize = 'cover';
      card.style.backgroundPosition = 'center';
    }

    // Gerenciamento da preferência de recados (Guestbook Clean)
    const guestbookSection = document.getElementById('guestbookSection');
    const allowGuestbook = data.allow_guestbook !== false;

    if (!allowGuestbook || !guestbookSection) {
      if (guestbookSection) guestbookSection.style.display = 'none';
    } else {
      guestbookSection.style.display = 'none'; 
    }
  }

  // Interatividade do Botão Hype (Estrela Neon + Confetes + Incremento)
  document.addEventListener('DOMContentLoaded', () => {
    const hypeBtn = document.getElementById('hypeBtn');
    const hypeCount = document.getElementById('hypeCount');
    const iconWrapper = document.getElementById('iconWrapper');

    if (hypeBtn && hypeCount && iconWrapper) {
      hypeBtn.addEventListener('click', () => {
        let current = parseInt(hypeCount.innerText, 10) || 0;
        hypeCount.innerText = current + 1;

        hypeBtn.classList.remove('hyped');
        void hypeBtn.offsetWidth;
        hypeBtn.classList.add('hyped');

        createNeonBurst(iconWrapper);
      });
    }
  });

  function createNeonBurst(targetContainer) {
    const particleCount = 14; 
    const rect = targetContainer.getBoundingClientRect();
    
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('span');
      particle.classList.add('particle');

      const size = Math.random() * 3 + 2;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;

      particle.style.left = `${centerX}px`;
      particle.style.top = `${centerY}px`;

      const angle = Math.random() * Math.PI * 2;
      const velocity = Math.random() * 45 + 25;
      
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity;

      particle.style.setProperty('--tx', `${tx}px`);
      particle.style.setProperty('--ty', `${ty}px`);

      targetContainer.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, 600);
    }
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const rawHandle = params.get('u') || params.get('user');

    if (!rawHandle || !rawHandle.trim()) {
      showError(
        'Perfil não especificado',
        'Abra um link de perfil que inclua o identificador do usuário.',
        true
      );
      return;
    }

    if (!window.islySupabase ||
        typeof window.islySupabase.getProfileByHandle !== 'function') {
      console.error('A integração ISLY.ME não está disponível.');

      showError(
        'Conexão indisponível',
        'Não foi possível conectar ao serviço de perfis. Tente novamente mais tarde.',
        true
      );
      return;
    }

    const handle = rawHandle.trim().replace(/^@/, '');

    try {
      const data = await window.islySupabase.getProfileByHandle(handle);

      if (!data) {
        showError(
          '404 — Universo não encontrado',
          'O perfil @' + handle + ' não foi encontrado ou ainda não foi publicado.',
          true
        );
        return;
      }

      renderProfile(data, handle);
    } catch (error) {
      console.error('Erro ao carregar perfil:', error);

      showError(
        'Não foi possível carregar o perfil',
        'Ocorreu um erro ao consultar os dados. Tente novamente.',
        true
      );
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
