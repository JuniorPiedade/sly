<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080812">
<title id="pageTitle">isly.me — Perfil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  if (typeof supabase === 'undefined') {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
  }
</script>
<style>
:root{color-scheme:dark;--bg:#080812;--panel:#11111f;--line:#292944;--text:#f6f4ff;--muted:#a6a4c4;--purple:#a855f7;--blue:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow-x:hidden;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.6;background:var(--bg);color:var(--text)}
.container{width:100%;max-width:640px}

.profile-card{
  overflow: visible !important;
  border-radius:28px;
  width:100%;
  max-width:640px;
  margin:0 auto;
  box-shadow:0 24px 70px rgba(0,0,0,0.6);
  padding:36px;
  text-align:left;
  transform-style:preserve-3d;
  perspective:1200px;
  transition:transform 0.15s ease-out;
  background-size:cover;
  background-position:center;
  display:flex;
  flex-direction:column;
  gap:20px;
  border: none !important;
}

.card-style-opaque { background-color: #11111f; }
.card-style-glass {
  background: rgba(13, 11, 20, 0.25) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border: 1px solid rgba(255, 255, 255, 0.12) !important;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5) !important;
}
.profile-header-row {
  display: flex;
  align-items: center;
  gap: 18px;
  overflow: visible !important;
}

.avatar-container {
  position: relative;
  width: 76px;
  height: 76px;
  flex-shrink: 0;
  display: block;
}

.avatar {
  width: 100% !important;
  height: 100% !important;
  border-radius: 20px;
  background: linear-gradient(145deg, #8b5cf6, #4c1d95);
  overflow: hidden;
  position: relative;
  z-index: 1;
  display: block;
  padding: 0 !important;
  margin: 0 !important;
}

.avatar img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  display: block !important;
  border-radius: inherit !important;
}

.avatar-frame {
  position: absolute;
  inset: -6px;
  pointer-events: none;
  z-index: 2;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
.frame-cyberpunk { border: 2px solid var(--blue); border-radius: 22px; box-shadow: 0 0 12px var(--blue); }
.frame-neon-gold { border: 2px solid #facc15; border-radius: 22px; box-shadow: 0 0 12px #facc15; }
.frame-royal-purple { border: 2px solid #c084fc; border-radius: 22px; box-shadow: 0 0 12px #c084fc; }

.profile-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  overflow: visible !important;
}

.profile-card h3{
  margin:0 0 2px;
  font-size:24px;
  font-weight:800;
  letter-spacing:-0.01em;
  white-space:nowrap;
  overflow: visible !important;
  text-overflow: clip;
}

.text-effect-glow {
  color: #ffffff !important;
  text-shadow: 
    0 0 5px rgba(255, 255, 255, 0.9),
    0 0 10px rgba(255, 255, 255, 0.7),
    0 0 20px rgba(255, 255, 255, 0.5),
    0 0 35px rgba(255, 255, 255, 0.3);
}

.handle{font-size:13px;font-weight:600;letter-spacing:0.02em;margin-bottom:4px}
.role-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(139,92,246,0.15);border:1px solid rgba(139,92,246,0.35);color:#c084fc;width:fit-content}

.bio-preview{font-size:13px;margin:4px 0 0;overflow-wrap:anywhere;line-height:1.5}
.live-status{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid rgba(34,211,238,0.3);background:rgba(34,211,238,0.08);color:#cffafe;border-radius:999px;font-size:11px;font-weight:600;margin:4px 0 0;width:fit-content}
.preview-emblems{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.preview-emblems span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid rgba(168,85,247,0.25);background:rgba(168,85,247,0.08);border-radius:99px;font-size:11px;font-weight:600;color:#ddd6fe}
.preview-emblems svg{width:14px;height:14px;fill:currentColor}

.public-socials{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.social-icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);text-decoration:none;transition:.2s}
.social-icon-btn svg{width:16px;height:16px;fill:currentColor}
.social-icon-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.08)}

.embeds-container{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.embed-wrapper{width:100%;border-radius:14px;overflow:hidden;background:#00000033;line-height:0}
.embed-wrapper iframe{width:100%;border:0;display:block}

.public-links{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.public-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-radius:14px;font-size:13px;font-weight:700;text-align:left;text-decoration:none;transition:all .25s ease;cursor:pointer;background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12)}
.public-link:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.4)}
.public-link .left{display:flex;align-items:center;gap:10px;min-width:0}
.public-link .left span:last-child{overflow:hidden;text-overflow:ellipsis}

.views-counter{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:16px;font-size:12px;color:var(--muted)}
.views-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(10px);color:#c9c5e2;font-weight:600}

.profile-foot{font-size:10px;color:#777391;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;padding:14px 0 18px;text-align:center;border-top:1px solid rgba(255,255,255,0.08);margin-top:6px}
.error-box{text-align:center;padding:30px;color:#fcd9a1}

/* =========================================================
   PLAYER DE TRILHA SONORA
   ========================================================= */
#soundtrackWidget {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  background: rgba(13, 11, 20, 0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 99px;
  padding: 6px 14px 6px 6px;
  align-items: center;
  gap: 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  transition: all 0.25s ease;
}
#soundtrackWidget:hover {
  background: rgba(13, 11, 20, 0.65);
  border-color: rgba(255, 255, 255, 0.15);
}
#stPlayBtn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f6f4ff;
  cursor: pointer;
  font-size: 10px;
  padding: 0;
  line-height: 1;
  flex-shrink: 0;
  transition: background 0.2s, transform 0.2s, border-color 0.2s;
}
#stPlayBtn:hover {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.25);
  transform: scale(1.05);
}
.st-info { display: flex; flex-direction: column; text-align: left; }
.st-title { font-size: 11px; color: #f6f4ff; font-weight: 600; letter-spacing: 0.3px; }
.st-status { font-size: 9px; color: var(--muted); letter-spacing: 0.3px; }

/* ========================================================= */
/* GUESTBOOK (MURAL EMPILHADO NO CANTO DIREITO COM ZOOM)     */
/* ========================================================= */
#guestbookContainer {
  position: fixed;
  top: 24px;
  right: 24px;
  bottom: 80px;
  width: 200px;
  pointer-events: none;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
  overflow: hidden;
}

.guestbook-note {
  pointer-events: auto;
  width: 100%;
  padding: 14px 16px;
  font-size: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: transform 0.2s ease, z-index 0.2s ease;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-radius: 6px;
}
.guestbook-note:hover {
  transform: scale(1.04) translateX(-4px);
  z-index: 1000;
}

.note-style-vintage {
  background: #fdfbf7;
  color: #1a1a1a;
  border-left: 4px solid #d4c5a9;
  font-family: 'Courier New', Courier, monospace;
}
.note-style-chalk {
  background: rgba(18, 18, 26, 0.9);
  backdrop-filter: blur(8px);
  color: #e2e8f0;
  border: 1px dashed rgba(255, 255, 255, 0.3);
  font-family: 'Comic Sans MS', cursive, sans-serif;
}
.note-style-dev {
  background: #ffffff;
  color: #0f172a;
  border: 1px solid #e2e8f0;
  font-family: 'Times New Roman', Times, serif;
}
.note-style-dev .note-code-tag {
  font-size: 9px;
  color: #64748b;
  font-family: monospace;
}

.note-author {
  font-size: 10px;
  font-weight: 700;
  opacity: 0.7;
  text-transform: uppercase;
}

.note-preview-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Botão para abrir o modal de novo recado */
#openNoteModalBtn {
  position: fixed;
  bottom: 24px;
  left: 24px;
  z-index: 1000;
  background: rgba(13, 11, 20, 0.7);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #f6f4ff;
  border-radius: 99px;
  padding: 10px 18px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  transition: all 0.2s;
}
#openNoteModalBtn:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: translateY(-2px);
}

/* Modais (Envio e Leitura Expandida) */
.note-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  z-index: 9999;
  place-items: center;
  padding: 20px;
}
.note-modal-box {
  background: #11111f;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  width: 100%;
  max-width: 360px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}
.note-modal-box h3 { margin: 0; font-size: 16px; color: #f6f4ff; }
.note-modal-box input, .note-modal-box textarea {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px 14px;
  color: #fff;
  font-size: 13px;
  outline: none;
}
.note-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.note-btn {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: none;
}
.note-btn-cancel { background: rgba(255,255,255,0.08); color: #a6a4c4; }
.note-btn-submit { background: #a855f7; color: #fff; }

.animate-item { opacity: 0; transform: translateY(16px); animation: cascadeIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes cascadeIn { to { opacity: 1; transform: translateY(0); } }
.delay-1 { animation-delay: 0.05s; }
.delay-2 { animation-delay: 0.12s; }
.delay-3 { animation-delay: 0.18s; }
.delay-4 { animation-delay: 0.24s; }
.delay-5 { animation-delay: 0.30s; }
.delay-6 { animation-delay: 0.36s; }
</style>
</head>
<body>
<div class="container">
  <div class="profile-card card-style-opaque" id="profileCard">
    <div class="profile-header-row animate-item delay-1">
      <div class="avatar-container">
        <div class="avatar" id="avatar">⌬</div>
        <div id="avatarFrame" class="avatar-frame"></div>
      </div>
      <div class="profile-info">
        <h3 id="name">Carregando...</h3>
        <div class="handle" id="handle">@...</div>
        <div class="role-badge" id="roleBadge">👾 Membro</div>
      </div>
    </div>
    <p class="bio-preview animate-item delay-2" id="bio"></p>
    <div class="live-status animate-item delay-3" id="statusBox"><span id="statusEmoji">🎮</span><span id="statusText">Buscando universo...</span></div>
    <div class="preview-emblems animate-item delay-3" id="emblems"></div>
    <div class="public-socials animate-item delay-3" id="socialsBar"></div>
    <div class="embeds-container animate-item delay-4" id="embedsBar"></div>
    <div class="public-links animate-item delay-4" id="links"></div>
    <div class="profile-foot animate-item delay-5"><a href="landing.html" style="color:inherit">CRIADO NO ISLY.ME ✦</a></div>
  </div>

  <div class="views-counter animate-item delay-6">
    <div class="views-badge">
      <span>👁️</span>
      <span id="publicViewsCount">0</span>
      <span>visualizações</span>
    </div>
  </div>
</div>

<!-- Widget Trilha Sonora -->
<div id="soundtrackWidget">
  <button id="stPlayBtn" aria-label="Tocar Trilha Sonora">▶</button>
  <div class="st-info">
    <span class="st-title">🎵 Trilha Sonora</span>
    <span class="st-status" id="stStatus">Pausado</span>
  </div>
  <audio id="stAudio" preload="none" loop></audio>
</div>

<!-- Container do Mural no Canto Direito -->
<div id="guestbookContainer"></div>

<!-- Botão Deixar Recado -->
<button id="openNoteModalBtn" aria-label="Deixar Recado">Deixar Recado</button>

<!-- Modal de Envio -->
<div id="noteModal" class="note-modal-overlay">
  <div class="note-modal-box">
    <h3>Deixar um recado no mural</h3>
    <p style="font-size: 11px; color: #a6a4c4; margin: 0;">Apenas utilizadores logados. Máx. 20 caracteres.</p>
    <input type="text" id="noteAuthorInput" placeholder="Seu nome (máx 20)" maxlength="20">
    <input type="text" id="noteMessageInput" placeholder="Recado (máx 20)" maxlength="20">
    <div class="note-modal-actions">
      <button class="note-btn note-btn-cancel" id="closeNoteModalBtn">Cancelar</button>
      <button class="note-btn note-btn-submit" id="submitNoteBtn">Fixar Recado</button>
    </div>
  </div>
</div>

<!-- Modal de Leitura Expandida (Zoom ao Clicar) -->
<div id="readNoteModal" class="note-modal-overlay">
  <div class="note-modal-box">
    <h3 id="readModalAuthor">Recado</h3>
    <p id="readModalMessage" style="font-size: 14px; color: #f6f4ff; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; margin: 0; word-break: break-word;"></p>
    <div class="note-modal-actions">
      <button class="note-btn note-btn-cancel" id="closeReadModalBtn">Fechar</button>
    </div>
  </div>
</div>

<script src="js/supabase.js"></script>

document.addEventListener("DOMContentLoaded", async () => {
  const modal = document.getElementById('noteModal');
  const readModal = document.getElementById('readNoteModal');
  
  document.getElementById('openNoteModalBtn').addEventListener('click', async () => {
    // Valida se o utilizador está logado antes de abrir o modal
    const user = await window.islySupabase.getUser();
    if (!user) {
      alert('Precisa de estar cadastrado e logado para deixar um recado.');
      window.location.href = 'landing.html';
      return;
    }
    if (modal) modal.style.display = 'grid';
  });

  document.getElementById('closeNoteModalBtn').addEventListener('click', () => {
    if (modal) modal.style.display = 'none';
  });
  document.getElementById('closeReadModalBtn').addEventListener('click', () => {
    if (readModal) readModal.style.display = 'none';
  });

  const urlParams = new URLSearchParams(window.location.search);
  const rawHandle = urlParams.get('u') || urlParams.get('user');

  if (!rawHandle || !window.islySupabase) {
    document.querySelector('.container').innerHTML = '<div class="error-box"><h2>Perfil não especificado.</h2><p>Verifique o endereço acessado.</p></div>';
    return;
  }

  const handle = rawHandle.trim().replace(/^@/, '');
  const data = await window.islySupabase.getProfileByHandle(handle);

  if (!data) {
    document.querySelector('.container').innerHTML = `<div class="error-box"><h2>404 — Universo não encontrado</h2><p>O perfil "@${handle}" ainda não foi publicado.</p></div>`;
    return;
  }

  // Carregamento de dados básicos do perfil...
  document.body.style.backgroundColor = data.bg_color || '#080812';
  if (data.custom_cursor) document.body.style.cursor = `url('${data.custom_cursor}'), auto`;

  const card = document.getElementById('profileCard');
  if (card) {
    const cardStyleType = data.card_style || 'opaque';
    card.classList.add(cardStyleType === 'glass' ? 'card-style-glass' : 'card-style-opaque');
    if (data.wallpaper_url) {
      document.body.style.backgroundImage = `linear-gradient(rgba(8, 8, 18, 0.75), rgba(8, 8, 18, 0.75)), url('${data.wallpaper_url}')`;
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
    }
  }

  document.getElementById('pageTitle').textContent = (data.name || handle) + ' — isly.me';
  document.getElementById('name').textContent = data.name || 'Sem nome';
  document.getElementById('handle').textContent = '@' + data.handle;
  document.getElementById('bio').textContent = data.bio || '';

  // Lógica de Renderização do Guestbook Empilhado no Canto Direito (Máx 5 recados)
  const container = document.getElementById('guestbookContainer');
  const profileId = data.id;
  const globalStyle = data.guestbook_style || 'vintage';

  async function loadNotes() {
    try {
      const { data: notes, error } = await window.islySupabase.client
        .from('guestbook_notes')
        .select('*')
        .eq('profile_id', profileId)
        .order('created_at', { ascending: false })
        .limit(5); // Restrito estritamente a 5 recados

      if (error) throw error;
      container.innerHTML = '';

      if (notes) {
        notes.forEach(note => {
          const el = document.createElement('div');
          el.className = `guestbook-note note-style-${note.style || globalStyle}`;

          let innerHTML = `<span class="note-author">@${escapeHtml(note.author)}</span>`;
          if (note.style === 'dev' || globalStyle === 'dev') {
            innerHTML += `<span class="note-code-tag">// msg</span>`;
          }
          innerHTML += `<span class="note-preview-text">${escapeHtml(note.message)}</span>`;

          el.innerHTML = innerHTML;

          // Evento de Zoom ao Clicar para leitura completa
          el.addEventListener('click', () => {
            document.getElementById('readModalAuthor').textContent = `Recado de @${escapeHtml(note.author)}`;
            document.getElementById('readModalMessage').textContent = note.message;
            readModal.style.display = 'grid';
          });

          container.appendChild(el);
        });
      }
    } catch (e) {
      console.warn("Erro ao carregar guestbook:", e);
    }
  }

  function escapeHtml(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  loadNotes();

  // Envio do Recado validando Utilizador Logado
  document.getElementById('submitNoteBtn').addEventListener('click', async () => {
    const authUser = await window.islySupabase.getUser();
    if (!authUser) {
      alert('Sessão expirada. Faça login novamente.');
      return;
    }

    const author = document.getElementById('noteAuthorInput').value.trim();
    const message = document.getElementById('noteMessageInput').value.trim();

    if (!author || !message) {
      alert('Preencha ambos os campos (máximo de 20 caracteres cada).');
      return;
    }

    try {
      const { error } = await window.islySupabase.client
        .from('guestbook_notes')
        .insert([{
          profile_id: profileId,
          user_id: authUser.id,
          author: author.substring(0, 20),
          message: message.substring(0, 20),
          style: globalStyle,
          pos_x: 0,
          pos_y: 0
        }]);

      if (error) throw error;

      modal.style.display = 'none';
      document.getElementById('noteAuthorInput').value = '';
      document.getElementById('noteMessageInput').value = '';
      loadNotes();
    } catch (e) {
      alert('Erro ao fixar recado. Tente novamente.');
      console.error(e);
    }
  });
});
</script>
