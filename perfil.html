<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080812">
<title>ISLY.ME — Perfil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  if (typeof supabase === 'undefined') {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
  }
</script>
<style>
:root{color-scheme:dark;--bg:#080812;--panel:#11111f;--line:#292944;--text:#f6f4ff;--muted:#a6a4c4;--purple:#a855f7;--blue:#22d3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.profile-card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px 24px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.6);position:relative;overflow:hidden}

.avatar-container{width:96px;height:96px;margin:0 auto 16px;border-radius:50%;background:#8b5cf633;display:grid;place-items:center;overflow:hidden;border:2px solid var(--purple);box-shadow:0 0 15px rgba(168,85,247,0.3)}
.avatar-container img{width:100%;height:100%;object-fit:cover}

h1{font-size:22px;font-weight:800;margin:0 0 4px;color:white}
.handle{font-size:13px;color:var(--muted);margin-bottom:16px}
.bio{font-size:14px;line-height:1.5;color:var(--text);margin-bottom:24px;opacity:0.9}

.links-stack{display:flex;flex-direction:column;gap:12px}
.profile-link{display:flex;align-items:center;justify-content:center;gap:10px;background:#ffffff08;border:1px solid var(--line);padding:12px 16px;border-radius:14px;color:white;font-weight:600;text-decoration:none;transition:all 0.2s ease}
.profile-link:hover{background:#ffffff15;border-color:var(--purple);box-shadow:0 0 15px rgba(168,85,247,0.2);transform:translateY(-2px)}

/* ==========================================
   PLAYER DE TRILHA SONORA (GLASS + NEON SUAVE)
   ========================================== */
#soundtrackWidget {
  display: none; /* Só aparece se houver áudio */
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 999;
  background: rgba(17, 17, 31, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(168, 85, 247, 0.35);
  border-radius: 99px;
  padding: 8px 18px 8px 10px;
  align-items: center;
  gap: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.15);
  transition: all 0.3s ease;
}

#soundtrackWidget:hover {
  border-color: rgba(168, 85, 247, 0.7);
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(168, 85, 247, 0.3);
}

#stPlayBtn {
  background: linear-gradient(135deg, #a855f7, #7c3aed);
  border: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  cursor: pointer;
  font-size: 12px;
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#stPlayBtn:hover {
  transform: scale(1.08);
  box-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
}

.st-info {
  display: flex;
  flex-direction: column;
  text-align: left;
}

.st-title {
  font-size: 12px;
  color: #f6f4ff;
  font-weight: 700;
  text-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
}

.st-status {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div class="profile-card" id="mainCard">
  <div class="avatar-container">
    <div id="profileAvatar">⌬</div>
  </div>
  <h1 id="profileName">Carregando...</h1>
  <div class="handle" id="profileHandle">@...</div>
  <p class="bio" id="profileBio"></p>
  <div class="links-stack" id="profileLinks"></div>
</div>

<!-- Widget Flutuante de Trilha Sonora -->
<div id="soundtrackWidget">
  <button id="stPlayBtn" aria-label="Tocar Trilha Sonora">▶</button>
  <div class="st-info">
    <span class="st-title">🎵 Trilha Sonora</span>
    <span class="st-status" id="stStatus">Pausado</span>
  </div>
  <audio id="stAudio" preload="none" loop></audio>
</div>

<script src="js/supabase.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  if (!window.islySupabase) return;

  // Pega o handle da URL (ex: perfil.html?u=dielsly ou rota amigável)
  const urlParams = new URLSearchParams(window.location.search);
  const handleQuery = urlParams.get('u') || window.location.pathname.split('/').pop();

  if (!handleQuery) {
    document.getElementById('profileName').textContent = 'Perfil não especificado.';
    return;
  }

  try {
    const profile = await window.islySupabase.getProfileByHandle(handleQuery.replace('@', ''));
    
    if (!profile) {
      document.getElementById('profileName').textContent = 'Usuário não encontrado.';
      document.getElementById('profileHandle').textContent = '';
      return;
    }

    // Renderiza dados básicos do perfil
    document.getElementById('profileName').textContent = profile.name || 'Sem nome';
    document.getElementById('profileHandle').textContent = '@' + (profile.handle || 'isly');
    document.getElementById('profileBio').textContent = profile.bio || '';

    if (profile.avatar_url) {
      document.querySelector('.avatar-container').innerHTML = `<img src="${profile.avatar_url}" alt="Avatar">`;
    }

    // Ativa e configura a Trilha Sonora se o usuário tiver cadastrado uma
    if (profile.soundtrack_url) {
      const widget = document.getElementById('soundtrackWidget');
      const audio = document.getElementById('stAudio');
      const playBtn = document.getElementById('stPlayBtn');
      const statusTxt = document.getElementById('stStatus');

      audio.src = profile.soundtrack_url;
      widget.style.display = 'flex';

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play().then(() => {
            playBtn.textContent = '❚❚';
            statusTxt.textContent = 'A tocar...';
          }).catch(err => {
            console.warn("Reprodução bloqueada pelo navegador:", err);
          });
        } else {
          audio.pause();
          playBtn.textContent = '▶';
          statusTxt.textContent = 'Pausado';
        }
      });
    }

  } catch (err) {
    console.error("Erro ao carregar perfil público:", err);
    document.getElementById('profileName').textContent = 'Erro ao carregar perfil.';
  }
});
</script>
</body>
</html>
