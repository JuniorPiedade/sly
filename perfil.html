<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080812">
<title id="pageTitle">isly.me — Perfil</title>

<style>
:root{color-scheme:dark;--bg:#080812;--panel:#11111f;--line:#292944;--text:#f6f4ff;--muted:#a6a4c4;--purple:#a855f7;--blue:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow-x:hidden;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.6}
.container{width:100%;max-width:440px}

.profile-card{
  overflow:hidden;
  border-radius:24px;
  width: 100%;
  max-width: 580px; /* Alargado para o formato horizontal retangular */
  margin: 0 auto;
  box-shadow:0 24px 70px rgba(0,0,0,0.6);
  text-align:center;
  transform-style:preserve-3d;
  perspective:1000px;
  transition:transform 0.1s ease-out;
  padding:32px 36px 28px;
  background-size:cover;
  background-position:center;
}

/* Estilo Opaco */
.card-style-opaque {
  background-color: #11111f;
}

/* Estilo Vidro 3D (Glassmorphism) */
.card-style-glass {
  background: rgba(17, 17, 31, 0.65);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.12) !important;
  box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
}

.avatar{width:88px;height:88px;margin:0 auto 14px;position:relative;display:grid;place-items:center;border:3px solid rgba(255,255,255,0.15);border-radius:22px;background:linear-gradient(135deg,#9333ea,#2563eb);box-shadow:0 10px 25px rgba(147,51,234,0.45);font-size:36px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

.profile-card h3{margin:8px 0 2px;font-size:22px;font-weight:800;letter-spacing:-0.01em}
.verified{color:var(--blue);font-size:13px}
.handle{font-size:13px;font-weight:600;letter-spacing:0.02em}
.role-badge{display:inline-block;margin:8px 0 6px;font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px;background:rgba(139,92,246,0.15);border:1px solid rgba(139,92,246,0.35);color:#c084fc}
.bio-preview{font-size:13px;margin:10px 0 14px;overflow-wrap:anywhere;line-height:1.5}
.live-status{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid rgba(34,211,238,0.3);background:rgba(34,211,238,0.08);color:#cffafe;border-radius:999px;font-size:11px;font-weight:600;margin:0 auto 14px;max-width:90%}
.preview-emblems{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:0 0 14px}
.preview-emblems span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid rgba(168,85,247,0.25);background:rgba(168,85,247,0.08);border-radius:99px;font-size:11px;font-weight:600;color:#ddd6fe}
.preview-emblems svg{width:14px;height:14px;fill:currentColor}

.public-socials{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:0 0 14px}
.social-icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);text-decoration:none;transition:.2s}
.social-icon-btn svg{width:18px;height:18px;fill:currentColor}
.social-icon-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.08)}

/* Container de Embeds */
.embeds-container{padding:0 0 14px;display:flex;flex-direction:column;gap:12px}
.embed-wrapper{width:100%;border-radius:14px;overflow:hidden;background:#00000033;line-height:0}
.embed-wrapper iframe{width:100%;border:0;display:block}

.public-links{padding:0 0 4px}
.public-link{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;padding:13px 15px;border-radius:12px;font-size:12px;font-weight:700;text-align:left;text-decoration:none;transition:all .25s ease;cursor:pointer}
.public-link:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.4)}
.public-link .left{display:flex;align-items:center;gap:10px;min-width:0}
.public-link .left span:last-child{overflow:hidden;text-overflow:ellipsis}

.text-effect-neon { text-shadow: 0 0 5px #c084fc, 0 0 10px #c084fc, 0 0 20px #a855f7, 0 0 40px #a855f7; }
.text-effect-gradient { background: linear-gradient(135deg, #c084fc, #22d3ee, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.text-effect-glass { color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 1px rgba(255,255,255,0.6); }

.views-counter{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:16px;font-size:12px;color:var(--muted)}
.views-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(10px);color:#c9c5e2;font-weight:600}

.profile-foot{font-size:10px;color:#777391;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;padding:14px 0 18px;text-align:center}
.error-box{text-align:center;padding:30px;color:#fcd9a1}

.animate-item { opacity: 0; transform: translateY(16px); animation: cascadeIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes cascadeIn { to { opacity: 1; transform: translateY(0); } }
.delay-1 { animation-delay: 0.05s; }
.delay-2 { animation-delay: 0.12s; }
.delay-3 { animation-delay: 0.18s; }
.delay-4 { animation-delay: 0.24s; }
.delay-5 { animation-delay: 0.30s; }
.delay-6 { animation-delay: 0.36s; }
.delay-7 { animation-delay: 0.42s; }
.delay-8 { animation-delay: 0.48s; }
</style>
</head>

<div class="container">

    <div class="avatar animate-item delay-1" id="avatar">👾</div>
    <h3 class="animate-item delay-2" id="name">Carregando... <span class="verified">✦</span></h3>
    <div class="handle animate-item delay-2" id="handle">@...</div>
    <div class="role-badge animate-item delay-3" id="roleBadge">💎 Fundador</div>
    <p class="bio-preview animate-item delay-3" id="bio"></p>
    <div class="live-status animate-item delay-4" id="statusBox"><span id="statusEmoji">🎮</span><span id="statusText">Buscando universo...</span></div>
    <div class="preview-emblems animate-item delay-4" id="emblems"></div>
    <div class="public-socials animate-item delay-4" id="socialsBar"></div>
    <div class="embeds-container animate-item delay-5" id="embedsBar"></div>
    <div class="public-links animate-item delay-5" id="links"></div>

    <div class="views-badge">

    </div>

  <div class="profile-foot animate-item delay-7"><a href="landing.html" style="color:inherit">CRIADO NO ISLY.ME ✦</a></div>
</div>

function getSpotifyEmbed(url) {
  if (!url) return '';
  const match = url.match(/spotify\.com\/(track|album|playlist|artist)\/([a-zA-Z0-9]+)/);
  if (match) {
    return `<div class="embed-wrapper"><iframe src="https://open.spotify.com/embed/${match[1]}/${match[2]}?utm_source=generator&theme=0" height="80" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>`;
  }
  return '';
}

function getYoutubeEmbed(url) {
  if (!url) return '';
  let id = '';
  if (url.includes('v=')) id = url.split('v=')[1]?.split('&')[0];
  else if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1]?.split('?')[0];
  if (id) {
    return `<div class="embed-wrapper"><iframe src="https://www.youtube.com/embed/${id}" height="180" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  }
  return '';
}

function getInstagramEmbed(url) {
  if (!url) return '';
  const match = url.match(/instagram\.com\/(p|reel)\/([a-zA-Z0-9_-]+)/);
  if (match) {
    return `<div class="embed-wrapper"><iframe src="https://www.instagram.com/${match[1]}/${match[2]}/embed" height="360" frameborder="0" scrolling="no" allowtransparency="true"></iframe></div>`;
  }
  return '';
}

document.addEventListener("DOMContentLoaded", async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const rawHandle = urlParams.get('u') || urlParams.get('user');

  if (!rawHandle || !window.islySupabase) {
    document.querySelector('.container').innerHTML = '<div class="error-box"><h2>Perfil não especificado.</h2><p>Verifique o endereço acessado.</p></div>';
    return;
  }

  const handle = rawHandle.trim().replace(/^@/, '');
  const data = await window.islySupabase.getProfileByHandle(handle);

  if (!data) {
    document.querySelector('.container').innerHTML = `<div class="error-box"><h2>404 — Universo não encontrado</h2><p>O perfil "@${handle}" ainda não foi publicado.</p></div>`;
    return;
  }

  let currentViews = (data.views_count || 0) + 1;
  document.getElementById('publicViewsCount').textContent = currentViews;
  try {
    await window.islySupabase.saveProfile({ id: data.id, views_count: currentViews });
  } catch (e) {
    console.warn("Analytics Error:", e);
  }

  document.body.style.backgroundColor = data.bg_color || '#080812';

  const card = document.getElementById('profileCard');
  if (card) {
    // Configura o estilo do Card (Opaco ou Vidro 3D)
    const cardStyleType = data.card_style || 'opaque';
    card.classList.remove('card-style-opaque', 'card-style-glass');
    
    if (cardStyleType === 'glass') {
      card.classList.add('card-style-glass');
      card.style.backgroundColor = '';
    } else {
      card.classList.add('card-style-opaque');
      card.style.backgroundColor = data.card_bg || '#11111f';
    }

    // Se houver wallpaper enviado pelo usuário, aplica na imagem de fundo do card
    if (data.wallpaper_url) {
      card.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url('${data.wallpaper_url}')`;
    }

    card.style.border = `1px solid ${data.border_color || '#a855f7'}`;

    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const xc = rect.width / 2;
      const yc = rect.height / 2;
      const dx = (x - xc) / xc;
      const dy = (y - yc) / yc;
      card.style.transform = `perspective(1000px) rotateY(${dx * 12}deg) rotateX(${-dy * 12}deg) translateY(-4px)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg) translateY(0px)';
    });
  }

  const nameEl = document.getElementById('name');
  if (nameEl) {
    nameEl.style.color = data.title_color || '#ffffff';
    if (data.name_effect === 'neon') nameEl.classList.add('text-effect-neon');
    else if (data.name_effect === 'gradient') nameEl.classList.add('text-effect-gradient');
    else if (data.name_effect === 'glass') nameEl.classList.add('text-effect-glass');
  }

  const bioEl = document.getElementById('bio');
  if (bioEl) bioEl.style.color = data.text_color || '#f6f4ff';

  const handleEl = document.getElementById('handle');
  if (handleEl) handleEl.style.color = data.accent_color || '#c084fc';

  document.getElementById('pageTitle').textContent = (data.name || handle) + ' — isly.me';
  nameEl.innerHTML = `${data.name || 'Sem nome'} <span class="verified">✦</span>`;
  handleEl.textContent = '@' + data.handle;

  const roleBadge = document.getElementById('roleBadge');
  if (roleBadge) {
    const r = data.role || 'Membro';
    roleBadge.innerHTML = r === 'Fundador' ? '💎 Fundador' : r === 'Suporte' ? '🛡️ Suporte' : r === 'Apoiador' ? '⭐ Apoiador' : '👾 Membro';
  }

  bioEl.textContent = data.bio || '';
  document.getElementById('statusEmoji').textContent = data.status_emoji || '🎮';
  document.getElementById('statusText').textContent = (data.status_label || 'Jogando') + (data.activity ? ' · ' + data.activity : '');

  const avatarEl = document.getElementById('avatar');
  if (data.avatar_url) {
    avatarEl.innerHTML = `<img src="${data.avatar_url}" alt="${data.name || 'Avatar'}">`;
  } else {
    avatarEl.textContent = data.avatar_emoji || '👾';
  }

  const emblemsEl = document.getElementById('emblems');
  if (emblemsEl) {
    emblemsEl.innerHTML = (data.emblems || []).map(id => {
      const svg = emblemSvgs[id] || '';
      return `<span>${svg} ${emblemNames[id] || id}</span>`;
    }).join('');
  }

  const socialsBar = document.getElementById('socialsBar');
  if (socialsBar && data.socials) {
    let sHTML = '';
    Object.keys(data.socials).forEach(key => {
      const val = data.socials[key];
      if (val && socialUrls[key]) {
        const url = socialUrls[key](val);
        const svg = socialSvgs[key] || '';
        sHTML += `<a class="social-icon-btn" href="${url}" target="_blank" rel="noopener" title="${key}" style="color:${data.accent_color || '#c084fc'}">${svg}</a>`;
      }
    });
    socialsBar.innerHTML = sHTML;
  }

  const embedsBar = document.getElementById('embedsBar');
  if (embedsBar) {
    let eHTML = '';
    eHTML += getSpotifyEmbed(data.embed_spotify);
    eHTML += getYoutubeEmbed(data.embed_youtube);
    eHTML += getInstagramEmbed(data.embed_instagram);
    embedsBar.innerHTML = eHTML;
  }

  const linksEl = document.getElementById('links');
  if (linksEl) {
    const linkBg = data.link_bg || '#1c1b2d';
    const linkText = data.link_text_color || '#ffffff';
    const linkBorder = data.border_color || '#39324f';

    linksEl.innerHTML = (data.links || []).map(link => `
      <a class="public-link" data-url="${link.url || '#'}" target="_blank" rel="noopener" style="background:${linkBg}; color:${linkText}; border:1px solid ${linkBorder}">
        <span class="left"><span>${link.emoji || '↗'}</span><span>${link.title || 'Link'}</span></span>
        <span class="arr" style="color:${data.accent_color || '#c084fc'}">↗</span>
      </a>
    `).join('');

    document.querySelectorAll('.public-link').forEach(linkBtn => {
      linkBtn.addEventListener('click', async (evt) => {
        evt.preventDefault();
        const targetUrl = linkBtn.getAttribute('data-url');
        try {
          const currentClicks = (data.clicks_count || 0) + 1;
          await window.islySupabase.saveProfile({ id: data.id, clicks_count: currentClicks });
        } catch (e) {
          console.warn("Analytics Error:", e);
        }
        if (targetUrl && targetUrl !== '#') window.open(targetUrl, '_blank');
      });
    });
  }
});
</script>
</body>
</html>
