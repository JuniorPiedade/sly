<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080812">
<title id="pageTitle">isly.me — Perfil</title>
<!-- Tailwind CSS CDN para o player minimalista -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome Icons CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=JetBrains+Mono:wght@200;300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  if (typeof supabase === 'undefined') {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
  }
</script>
<style>
:root{color-scheme:dark;--bg:#080812;--panel:#11111f;--line:#292944;--text:#f6f4ff;--muted:#a6a4c4;--purple:#a855f7;--blue:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow-x:hidden;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.6;background:var(--bg);color:var(--text);user-select:none; position: relative;}

/* --- CANVAS DE EFEITOS VISUAIS DE FUNDO --- */
#effectCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 0;
}

/* Garante que o conteúdo fique acima do canvas */
.page-wrapper, .guestbook-trigger-btn, header.fixed, .splash-overlay {
  position: relative;
  z-index: 10;
}

/* --- TELA DE ENTRADA (SPLASH SCREEN) --- */

.splash-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  width: 100%;
  height: 100%;
  background: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 1;
  visibility: visible;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}
.splash-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.splash-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  pointer-events: none;
}
.splash-star-wrapper {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: rgba(168, 85, 247, 0.08);
  border: 1px solid rgba(168, 85, 247, 0.3);
  display: grid;
  place-items: center;
  box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
  animation: splashPulse 2s infinite ease-in-out;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.splash-star-wrapper:hover {
  transform: scale(1.12);
  border-color: rgba(168, 85, 247, 0.9);
  box-shadow: 0 0 45px rgba(168, 85, 247, 0.6);
}
.splash-neon-star {
  width: 28px;
  height: 28px;
  fill: #ffffff;
  stroke: #ffffff;
  stroke-width: 1.5;
  filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
  transition: fill 0.2s ease, stroke 0.2s ease;
}
.splash-star-wrapper:hover .splash-neon-star {
  fill: #c084fc;
  stroke: #c084fc;
  filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.9));
}


.splash-text {
  font-family: Inter, Arial, sans-serif;
 font-size: clamp(16px, 2.5vw, 24px);
  font-weight: 900;
  letter-spacing: 3px;
  line-height: 1.15;
  text-align: center;
  text-transform: none;
  color: #ffffff;

  text-shadow:
  0 0 5px rgba(255, 255, 255, 0.45),
  0 0 12px rgba(255, 255, 255, 0.22);

  cursor: pointer;
  user-select: none;
  padding: 24px;
  max-width: 100%;
  overflow-wrap: anywhere;

  transition:
    color 0.25s ease,
    text-shadow 0.25s ease,
    transform 0.25s ease;
}

.splash-text:hover {
  color: #ffffff;
  text-shadow:
  0 0 7px rgba(255, 255, 255, 0.65),
  0 0 18px rgba(255, 255, 255, 0.35);

  transform: scale(1.03);
}


@keyframes splashPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(168, 85, 247, 0.2); }
  50% { transform: scale(1.06); box-shadow: 0 0 40px rgba(168, 85, 247, 0.4); }
}

/* WRAPPER PRINCIPAL PARA POSICIONAR O CARD */
.page-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
}

.container{width:100%;max-width:560px;position:relative}

.profile-card{
  opacity: 0;
  overflow: visible !important;
  border-radius:22px;
  width:100%;
  max-width:560px;
  margin:0 auto;
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
  padding:24px 26px;
  transform-style:preserve-3d;
  perspective:1200px;
  transition: opacity 0.4s ease, transform 0.15s ease-out;
  background-size:cover;
  background-position:center;
  border: none !important;
}

/* ESTILOS DE ALINHAMENTO DO CARTÃO AJUSTADOS */
.profile-card.align-left {
  text-align: left;
  display: grid;
  grid-template-columns: minmax(110px, .65fr) minmax(0, 1.35fr);
  grid-template-rows: auto;
  align-items: start;
  gap: 10px 18px;
}
.profile-card.align-left .profile-header-row {
  grid-column: 1;
  grid-row: 1 / span 7;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
  min-width: 0;
  padding: 2px 0 0;
}
.profile-card.align-left .bio-preview,
.profile-card.align-left .live-status,
.profile-card.align-left .preview-emblems,
.profile-card.align-left .public-socials,
.profile-card.align-left .embeds-container,
.profile-card.align-left #spotify-widget,
.profile-card.align-left .preview-friendships-wrapper,
.profile-card.align-left .stats-container,
.profile-card.align-left .profile-foot {
  grid-column: 2;
  min-width: 0;
}

.profile-card.align-center {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.profile-card.align-center .profile-header-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
}
.profile-card.align-center .profile-info {
  align-items: center;
}
.profile-card.align-center .profile-card h3 {
  white-space: normal;
  overflow-wrap: anywhere;
}
.profile-card.align-center .preview-emblems,
.profile-card.align-center .public-socials,
.profile-card.align-center .preview-friendships-wrapper,
.profile-card.align-center .stats-container {
  justify-content: center;
  width: 100%;
}
.profile-card.align-center .preview-emblems,
.profile-card.align-center .public-socials {
  justify-content: center;
}

/* Status Compacto e Centralizado no modo Center */
.profile-card.align-center .live-status {
  width: fit-content !important;
  margin: 0 auto !important;
}

.card-style-opaque { background-color: #11111f; }
.card-style-glass {
  background: rgba(13, 11, 20, 0.25) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border: 1px solid rgba(255, 255, 255, 0.12) !important;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5) !important;
}

.avatar-container {
  position: relative;
  width: 76px;
  height: 76px;
  flex-shrink: 0;
  display: block;
}

.avatar {
  width: 100% !important;
  height: 100% !important;
  border-radius: 20px;
  background: transparent;
  overflow: hidden;
  position: relative;
  z-index: 1;
  display: block;
  padding: 0 !important;
  margin: 0 !important;
}

.avatar img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  display: block !important;
  border-radius: inherit !important;
}

/* Formato padrão: quadrado com cantos arredondados */
.avatar.avatar-shape-rounded {
  border-radius: 20px !important;
}

/* Formato circular */
.avatar.avatar-shape-circle {
  border-radius: 50% !important;
}

.avatar.avatar-shape-circle img {
  border-radius: 50% !important;
}
  .profile-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  overflow: visible !important;
}

.profile-card h3{
  margin:0 0 2px;
  font-size:clamp(19px,2vw,25px);
  font-weight:800;
  letter-spacing:-0.01em;
  overflow: visible !important;
  text-overflow: clip;
}

.text-effect-glow {
  color: #ffffff !important;
  text-shadow: 
    0 0 5px rgba(255, 255, 255, 0.9),
    0 0 10px rgba(255, 255, 255, 0.7),
    0 0 20px rgba(255, 255, 255, 0.5),
    0 0 35px rgba(255, 255, 255, 0.3);
}

.handle{font-size:13px;font-weight:600;letter-spacing:0.02em;margin-bottom:4px}
.role-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(139,92,246,0.15);border:1px solid rgba(139,92,246,0.35);color:#c084fc;width:fit-content}

.bio-preview{font-size:13px;margin:4px 0 0;overflow-wrap:anywhere;line-height:1.5}

/* Status compacto (não estica em 100%) */
.live-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 11px;
  border:1px solid rgba(34,211,238,0.3);
  background:rgba(34,211,238,0.08);
  color:#cffafe;
  border-radius:999px;
  font-size:10px;
  font-weight:600;
  margin:4px 0 0;
  width:fit-content !important;
}

/* EMBLEMAS MINIMALISTAS E ENXUTOS */
.preview-emblems {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 4px;
}
.preview-emblems span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #e2dcf0;
  backdrop-filter: blur(8px);
  transition: all 0.2s ease;
}
.preview-emblems span:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.18);
  transform: translateY(-1px);
}

.public-socials{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.social-icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);text-decoration:none;transition:.2s}
.social-icon-btn img {
  width: 18px;
  height: 18px;
  object-fit: contain;
  display: block;
}
.social-icon-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.08)}

.embeds-container{display:flex;flex-direction:column;gap:12px;margin-top:4px;width:100%}
.embed-wrapper{width:100%;border-radius:14px;overflow:hidden;background:#00000033;line-height:0}
.embed-wrapper iframe{width:100%;border:0;display:block}

/* Container de Amigos Próximos */
.preview-friendships-wrapper {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
  width: 100%;
}

.preview-friendships-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 700;
  color: var(--muted, #a6a4c4);
  cursor: default;
  transition: all 0.3s ease;
  width: fit-content;
}

.profile-card.align-center .preview-friendships-title {
  margin: 0 auto;
}

.preview-friendships-title:hover {
  color: #ffffff;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 16px rgba(168, 85, 247, 0.8), 0 0 24px rgba(168, 85, 247, 0.5);
}

.preview-friendships {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.profile-card.align-center .preview-friendships {
  justify-content: center;
}

.preview-friend-bubble {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: rgba(255, 255, 255, 0.08);
  display: grid;
  place-items: center;
  font-size: 10px;
  font-weight: bold;
  color: white;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

.preview-friend-bubble:hover {
  transform: translateY(-2px) scale(1.08);
  border-color: #a855f7;
  box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
}

.preview-friend-bubble img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* --- CONTADORES E HYPE --- */
.stats-container {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
  width: 100%;
}
.profile-card.align-center .stats-container { justify-content: center; }
.profile-card.align-left .stats-container { justify-content: flex-start; }

.views-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  color: #c9c5e2;
  font-weight: 600;
  font-size: 11px;
}

.hype-button {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 38px;
  padding: 0 14px 0 6px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
  transition: transform 0.15s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}

.hype-button:hover {
  transform: scale(1.02);
  border-color: rgba(255, 255, 255, 0.4);
  box-shadow: 0 0 14px rgba(255, 255, 255, 0.15);
}

.hype-button:active {
  transform: scale(0.96);
}

.hype-button.hyped {
  border-color: rgba(168, 85, 247, 0.6);
  background: rgba(168, 85, 247, 0.08);
}

.hype-button.hyped.animate-flash {
  animation: flashGlow 0.4s ease-out;
}

@keyframes flashGlow {
  0% {
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.3);
    border-color: #ffffff;
  }
  100% {
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
  }
}

.icon-wrapper {
  position: relative;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.04);
}

.neon-star {
  width: 14px;
  height: 14px;
  fill: #FFFFFF;
  stroke: #FFFFFF;
  stroke-width: 1.5;
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.hype-button.hyped .neon-star {
  fill: #c084fc;
  stroke: #c084fc;
  transform: scale(1.2);
  filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.8));
}

.hype-count {
  color: #ffffff;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.particle {
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 6px #ffffff;
  animation: explode 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}

@keyframes explode {
  0% { opacity: 1; transform: translate(0, 0) scale(1); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
}

.profile-foot{font-size:10px;color:#777391;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;padding:14px 0 18px;text-align:center;border-top:1px solid rgba(255,255,255,0.08);margin-top:6px; width: 100%;}
.error-box{text-align:center;padding:30px;color:#fcd9a1}

@media(max-width: 1020px) {
  .page-wrapper { flex-direction: column; }
}

/* PLAYER ULTRA MINIMALISTA */
.glow-border {
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.03), inset 0 0 15px rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.glow-btn {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.glow-btn:hover {
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
  transform: scale(1.05);
}
.glow-btn:active {
  transform: scale(0.95);
}

.animate-item { opacity: 0; transform: translateY(16px); animation: cascadeIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes cascadeIn { to { opacity: 1; transform: translateY(0); } }
.delay-1 { animation-delay: 0.05s; }
.delay-2 { animation-delay: 0.12s; }
.delay-3 { animation-delay: 0.18s; }
.delay-4 { animation-delay: 0.24s; }
.delay-5 { animation-delay: 0.30s; }
.delay-6 { animation-delay: 0.36s; }
</style>

<style>
/* SLYE — modo preto absoluto */
.profile-card.full-black,
.profile-card.slye-full-black {
  background: #000000 !important;
  background-image: none !important;
  border: none !important;
  box-shadow: none !important;
  outline: none !important;
}

/* SLYE — refinamento visual */
body {
  background-color: #000000;
  background-image: none;
}

.profile-card {
  border: none !important;
  outline: none !important;
  box-shadow: none !important;
  border-radius: 24px;
  padding: 24px 26px;
}

.card-style-glass {
  background: rgba(18,18,27,.78) !important;
  border: 1px solid rgba(255,255,255,.13) !important;
  backdrop-filter: blur(20px) !important;
  -webkit-backdrop-filter: blur(20px) !important;
}

.social-icon-btn {
  border-radius: 12px;
}

.social-icon-btn:hover {
  border-color: rgba(168,85,247,.45);
  background: rgba(168,85,247,.1);
  transform: translateY(-3px);
}

.profile-foot {
  border-color: rgba(255,255,255,.07);
  letter-spacing: 1.2px;
}

@media (max-width: 600px) {
  .profile-card {
    border-radius: 21px;
  }

  #playerSection {
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
  }
}
</style>
</head>
<body>
  
<!-- CANVAS PARA OS EFEITOS VISUAIS DE FUNDO -->
<canvas id="effectCanvas"></canvas>

<!-- PLAYER ULTRA MINIMALISTA (FIXO NO CANTO INFERIOR ESQUERDO) -->
<header id="playerSection" class="fixed bottom-6 left-6 z-50 w-[280px] max-w-[90vw]" style="display: none;">
    <div id="playerWrapper" class="glow-border bg-[#09090b]/90 rounded-full px-3 py-1.5 flex items-center justify-between transition-all duration-500 shadow-2xl">
        
        <!-- Botão Play/Pause -->
        <button id="playPauseBtn" class="player-btn-action glow-btn relative w-7 h-7 rounded-full bg-white text-black flex items-center justify-center focus:outline-none cursor-pointer">
            <i id="playIcon" class="fa-solid fa-play text-[9px] translate-x-[1px]"></i>
            <i id="pauseIcon" class="fa-solid fa-pause text-[9px] hidden"></i>
        </button>

        <!-- Status / Nome da Trilha / Canvas -->
        <div class="flex flex-col items-center justify-center flex-1 mx-2.5 overflow-hidden">
            <div class="flex items-center gap-1 mb-0.5 w-full justify-center">
                <span id="trackStatus" class="inline-block w-1.5 h-1.5 rounded-full bg-neutral-600 transition-colors duration-300"></span>
                <span id="trackTitle" class="player-text-title text-[10px] font-mono tracking-wider uppercase text-neutral-400 truncate max-w-[100px]">
                    SOUNDTRACK
                </span>
            </div>
            <!-- Canvas do Visualizador -->
            <div class="w-full flex items-center justify-center h-2">
                <canvas id="visualizer" class="w-full h-full opacity-70"></canvas>
            </div>
        </div>

        <!-- Tempo / Mute -->
        <div class="player-text-meta flex items-center gap-2 text-neutral-400">
            <span id="timeDisplay" class="text-[9px] font-mono tracking-tighter text-neutral-500">00:00</span>
            <button id="muteBtn" class="hover:text-white transition-colors duration-200 focus:outline-none cursor-pointer">
                <i id="volumeIcon" class="fa-solid fa-volume-high text-[10px]"></i>
            </button>
        </div>

        <!-- Player oculto do YouTube (Invisível) -->
        <div id="youtubePlayerContainer" style="display:none; position:absolute; pointer-events:none; opacity:0; width:0; height:0; overflow:hidden;"></div>
    </div>
</header>

<!-- TELA DE ENTRADA (SPLASH SCREEN) -->
<div class="splash-overlay" id="splashScreen">
  <div class="splash-content">
    <div class="splash-text" id="splashTextDisplay"></div>
  </div>
</div>


<div class="page-wrapper">
  <div class="container">
    <div class="profile-card card-style-opaque" id="profileCard">
      <div class="profile-header-row animate-item delay-1">
        <div class="avatar-container">
          <div class="avatar" id="avatar">⌬</div>
          </div>
        <div class="profile-info">
          <h3 id="name">Carregando...</h3>
          <div class="handle" id="handle">@...</div>
          <div class="role-badge" id="roleBadge">👾 Membro</div>
        </div>
      </div>

let currentEffectAnimId = null;

function initVisualEffect(effectName) {
  const canvas = document.getElementById('effectCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  if (currentEffectAnimId) {
    cancelAnimationFrame(currentEffectAnimId);
  }

  if (effectName === 'stellar_dust') {
    const particles = Array.from({ length: 70 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.5 + 0.5,
      alpha: Math.random(),
      speed: Math.random() * 0.2 + 0.05
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = canvas.height;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      currentEffectAnimId = requestAnimationFrame(draw);
    }
    draw();

  } else if (effectName === 'neon_snowfall') {
    const flakes = Array.from({ length: 50 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2 + 1,
      speed: Math.random() * 0.8 + 0.3,
      drift: Math.random() * 0.5 - 0.25
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#22d3ee';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#22d3ee';
      flakes.forEach(f => {
        f.y += f.speed;
        f.x += f.drift;
        if (f.y > canvas.height) f.y = 0;
        if (f.x > canvas.width) f.x = 0;
        if (f.x < 0) f.x = canvas.width;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      currentEffectAnimId = requestAnimationFrame(draw);
    }
    draw();

  } else if (effectName === 'matrix_glitch') {
    const fontSize = 14;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array.from({ length: columns }, () => 1);
    const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&';

    function draw() {
      ctx.fillStyle = 'rgba(8, 8, 18, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#a855f7';
      ctx.font = `${fontSize}px monospace`;

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
      currentEffectAnimId = requestAnimationFrame(draw);
    }
    draw();
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

}

function getInstagramEmbed(url) {
  if (!url) return '';
  const match = url.match(/instagram\.com\/(p|reel)\/([a-zA-Z0-9_-]+)/);
  if (match) {
    return `<div class="embed-wrapper"><iframe src="https://www.instagram.com/${match[1]}/${match[2]}/embed" height="360" frameborder="0" scrolling="no" allowtransparency="true"></iframe></div>`;

function getYoutubeAudioId(url) {
  if (!url) return null;
  let id = '';
  if (url.includes('v=')) id = url.split('v=')[1]?.split('&')[0];
  else if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1]?.split('?')[0];
  else if (url.includes('embed/')) id = url.split('embed/')[1]?.split('?')[0];
  return id || url;
}

      if (requestInProgress || !supabaseUrl || !publicKey) return;

      requestInProgress = true;

      try {
        const endpoint =
          `${supabaseUrl}/functions/v1/spotify-auth` +
          `?action=now-playing&handle=${encodeURIComponent(handle)}`;

        const response = await fetch(endpoint, {
          headers: { apikey: publicKey },
          cache: "no-store"
        });

        if (!response.ok) {
          console.warn("Erro ao consultar Spotify:", response.status);
          return;
        }

        const track = await response.json();

          widget.style.display = "none";
          return;
        }

        title.textContent = track.title;
        artist.textContent = track.artist || "Artista desconhecido";

  if (hasSplashText && splashScreen && splashTextDisplay) {
    splashTextDisplay.textContent = data.splash_text;
    splashScreen.classList.remove('hidden');

    const handleSplashUnlock = (e) => {
      e.stopPropagation();
      splashScreen.classList.add('hidden');
      if (cardElement) cardElement.style.opacity = '1';
      
      const tryPlay = () => {
        if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
          try { ytPlayer.playVideo(); } catch (err) { setTimeout(tryPlay, 300); }
        } else { setTimeout(tryPlay, 300); }
      };
      tryPlay();
    };

    splashScreen.addEventListener('click', handleSplashUnlock);
    
  } else {
    if (splashScreen) splashScreen.classList.add('hidden');
    if (cardElement) cardElement.style.opacity = '1';
  }

  const canvas = document.getElementById('visualizer');
  const ctx = canvas ? canvas.getContext('2d') : null;

  function resizeCanvas() {
    if (canvas) {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    if (!canvas || !ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const bars = 20;
    const barWidth = 2;
    const gap = (canvas.width - (bars * barWidth)) / (bars - 1);

    for (let i = 0; i < bars; i++) {
      let barHeight = 2;
      if (isYtPlaying) {
        const randomFactor = Math.sin(Date.now() / 150 + i) * 0.5 + 0.5;
        barHeight = Math.max(4, randomFactor * canvas.height * 0.8);
      }
      const x = i * (barWidth + gap);
      const y = (canvas.height - barHeight) / 2;
      ctx.fillStyle = isYtPlaying ? 'rgba(255, 255, 255, 0.85)' : 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(x, y, barWidth, barHeight);
    }
  }
  drawVisualizer();

  const hypeBtn = document.getElementById('hypeBtn');
  const iconWrapper = document.getElementById('iconWrapper');

  if (hypeBtn && hypeCountEl && iconWrapper) {
    const storageKey = `isly_hyped_${data.id || handle}`;
    if (localStorage.getItem(storageKey) === 'true') {
      hypeBtn.classList.add('hyped');
    }

    hypeBtn.addEventListener('click', async () => {
      if (localStorage.getItem(storageKey) === 'true') return;
      let current = parseInt(hypeCountEl.innerText, 10) || 0;
      let newCount = current + 1;
      localStorage.setItem(storageKey, 'true');
      hypeBtn.classList.add('hyped', 'animate-flash');
      hypeCountEl.innerText = newCount;
      createNeonBurst(iconWrapper);

      try {
        if (window.islySupabase && typeof window.islySupabase.incrementHype === 'function') {
          await window.islySupabase.incrementHype(data.id, current);
        } else {
          await window.islySupabase.saveProfile({ id: data.id, hypes: newCount });
        }
      } catch (err) {
        console.warn("Erro ao salvar hype:", err);
      }
    });
  }

  function createNeonBurst(targetContainer) {
    const particleCount = 10;
    const rect = targetContainer.getBoundingClientRect();
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('span');
      particle.classList.add('particle');
      const size = Math.random() * 2 + 2;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${centerX}px`;
      particle.style.top = `${centerY}px`;
      const angle = Math.random() * Math.PI * 2;
      const velocity = Math.random() * 30 + 15;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity;
      particle.style.setProperty('--tx', `${tx}px`);
      particle.style.setProperty('--ty', `${ty}px`);
      targetContainer.appendChild(particle);
      setTimeout(() => particle.remove(), 500);
    }
  }
});
</script>
