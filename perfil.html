<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080812">
<title id="pageTitle">Perfil — ISLY.ME</title>
<style>
:root{color-scheme:dark;--bg:#080812;--panel:#11111f;--line:#292944;--text:#f6f4ff;--muted:#a6a4c4;--purple:#a855f7;--blue:#22d3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
a{color:inherit;text-decoration:none}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}

#effectCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 0;
}

.profile-card {
  position:relative;
  isolation:isolate;
  overflow:visible!important;
  width:100%;
  max-width:680px;
  min-width:0;
  margin:0 auto;
  display:grid;
  grid-template-columns:minmax(132px,.72fr) minmax(0,1.28fr);
  grid-template-rows:auto;
  align-items:start;
  gap:12px 22px;
  padding:27px;
  border:1px solid #a78bfa2b!important;
  border-radius:23px;
  background-color:#13101a;
  background-image:
    radial-gradient(ellipse at 10% 0%,#8b5cf61b,transparent 55%),
    linear-gradient(145deg,#17131f,#0f0c14);
  background-size: cover;
  background-position: center;
  box-shadow:0 24px 70px #00000055,0 0 0 1px #ffffff04,inset 0 1px #ffffff0a;
  text-align:left;
  transform-style:preserve-3d;
  perspective:1200px;
  z-index: 1;
}
.profile-card:before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(125deg,#ffffff06,transparent 35%,#8b5cf608);
}
.card-style-opaque{background-color:#13101a}
.card-style-glass {
  background: rgba(13, 11, 20, 0.25) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border: 1px solid rgba(255, 255, 255, 0.12) !important;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5) !important;
}

.profile-header-row{
  grid-column:1;grid-row:1 / span 7;display:flex;flex-direction:column;
  align-items:flex-start;gap:14px;min-width:0;padding:3px 0 0;
  overflow:visible!important
}
.avatar-container{
  position: relative;
  width: 76px;
  height: 76px;
  flex-shrink: 0;
  display: block;
}

.avatar {
  width: 100% !important;
  height: 100% !important;
  border-radius: 20px;
  background: linear-gradient(145deg, #8b5cf6, #4c1d95);
  overflow: hidden;
  position: relative;
  z-index: 1;
  display: block;
}

.avatar img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  display: block !important;
  border-radius: inherit !important;
}

.profile-info{width:100%;min-width:0;overflow:visible!important}
.profile-card h3{
  font-size:clamp(19px,2vw,25px);font-weight:800;line-height:1.2;
  letter-spacing:-.7px;white-space:normal;overflow-wrap:anywhere;
  margin:0 0 5px
}
.text-effect-glow {
  color: #ffffff !important;
  text-shadow: 
    0 0 5px rgba(255, 255, 255, 0.9),
    0 0 10px rgba(255, 255, 255, 0.7),
    0 0 20px rgba(255, 255, 255, 0.5),
    0 0 35px rgba(255, 255, 255, 0.3);
}
.handle{font-size:12px;color:#b9a0f7;overflow-wrap:anywhere}
.bio-preview,.live-status,.preview-emblems,.preview-socials,.embeds-container,.preview-links,.profile-foot{
  grid-column:2;min-width:0
}
.bio-preview{grid-row:1;font-size:13px;color:#c0b6cd;line-height:1.65;margin:2px 0 0}
.live-status{
  grid-row:2;margin:0;padding:6px 10px;width:fit-content;max-width:100%;
  border-color:#8b5cf638;background:#8b5cf60d;color:#e0d4fa;border-radius:99px;display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600
}

.preview-emblems{
  grid-row:3;
  margin-top:0;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}
.preview-emblems span{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:600;
  letter-spacing:0.2px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  color:#e2dcf0;
  backdrop-filter:blur(8px);
}

.preview-socials{grid-row:4;margin-top:0;display:flex;flex-wrap:wrap;gap:7px}
.preview-social-icon{
  width:34px;height:34px;border:1px solid #ffffff10;border-radius:11px;
  background:#ffffff06;color:#ded3eb;transition:transform .18s,border-color .18s,background .18s;display:grid;place-items:center
}
.preview-social-icon img {
  width: 18px;
  height: 18px;
  object-fit: contain;
  display: block;
}
.preview-social-icon:hover{transform:translateY(-2px);border-color:#a78bfa55;background:#8b5cf61a}

.embeds-container{grid-row:5;margin-top:0;display:flex;flex-direction:column;gap:12px}
.embed-wrapper{border:1px solid #ffffff12;border-radius:12px;background:#08070b;overflow:hidden;line-height:0}
.embed-wrapper iframe{width:100%;border:0;display:block}

.preview-friendships-wrapper {
  grid-row: 6.5;
  margin-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.preview-friendships-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 700;
  color: var(--muted);
}
.preview-friendships {
  display: flex;
  align-items: center;
  gap: 8px;
}
.preview-friend-bubble {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  display: grid;
  place-items: center;
  font-size: 9px;
  font-weight: bold;
}

.profile-foot{
  grid-row:7;text-align:left;padding-top:11px;margin-top:1px;border-top-color:#ffffff12;
  color:#887c99;font-size:9px;letter-spacing:1.4px;font-weight:700;text-transform:uppercase
}

@media(max-width:650px){
  body{padding:12px}
  .profile-card{
    grid-template-columns:minmax(100px,.68fr) minmax(0,1.32fr);
    gap:11px 14px;padding:18px 15px;border-radius:19px
  }
}
</style>
<script>
(function(){
 const sources=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2'];
 function loadSdk(i){
  if(i>=sources.length){window.__islySdkReadyFired=true;window.dispatchEvent(new Event('isly-sdk-ready'));return;}
  const s=document.createElement('script');s.src=sources[i];
  s.onload=function(){
   const m=document.createElement('script');m.src='/js/supabase.js';
   m.onload=function(){window.__islySdkReadyFired=true;window.dispatchEvent(new Event('isly-sdk-ready'));};
   m.onerror=function(){window.__islySdkReadyFired=true;window.dispatchEvent(new Event('isly-sdk-ready'));};
   document.head.appendChild(m);
  };
  s.onerror=function(){loadSdk(i+1);};document.head.appendChild(s);
 }
 loadSdk(0);
})();
</script>
</head>
<body>

<canvas id="effectCanvas"></canvas>

<div class="profile-card card-style-opaque" id="profileCard">
 <div class="profile-header-row">
  <div class="avatar-container">
   <div class="avatar" id="pubAvatar">⌬</div>
  </div>
  <div class="profile-info">
   <h3 id="pubName">Carregando...</h3>
   <div class="handle" id="pubHandle">@...</div>
  </div>
 </div>
 <p class="bio-preview" id="pubBio">...</p>
 <div class="live-status"><span id="pubStatusEmoji">🎮</span><span id="pubStatusText">Carregando status...</span></div>
 <div class="preview-emblems" id="pubEmblems"></div>
 <div class="preview-socials" id="pubSocials"></div>
 <div class="embeds-container" id="pubEmbeds"></div>
 
 <div class="preview-friendships-wrapper" id="pubFriendshipsWrapper" style="display: none;">
   <div class="preview-friendships-title">Amigos Próximos</div>
   <div class="preview-friendships" id="pubFriendships"></div>
 </div>

 <div class="profile-foot">CRIADO NO ISLY.ME ✦</div>
</div>

<script>
const emblemNames = {
  nerd: 'Nerd', gamer: 'Gamer', youtuber: 'Youtuber', programador: 'Programador',
  hacker: 'Hacker', streamer: 'Streamer', gotico: 'Gótico', anime: 'Anime',
  lol: 'LoL', habbo: 'Habbo', thesims: 'The Sims', valorant: 'Valorant',
  cod: 'Call Of Duty', cs: 'CS', gta: 'GTA', minecraft: 'Minecraft',
  rpg: 'RPG', artista: 'Artista', musica: 'Música', fundador: 'Fundador', geek: 'Geek'
};

const emblemEmojis = {
  nerd: '🤓', gamer: '🎮', youtuber: '▶️', programador: '💻',
  hacker: '⚡', streamer: '🟣', gotico: '🦇', anime: '🍥',
  lol: '⚔️', habbo: '🏨', thesims: '🟩', valorant: '🎯',
  cod: '🪖', cs: '💣', gta: '💰', minecraft: '⛏️',
  rpg: '🎲', artista: '🎨', musica: '🎧', fundador: '💎', geek: '🤓'
};

const socialLogos = {
 steam: 'https://cdn.simpleicons.org/steam/white',
 spotify: 'https://cdn.simpleicons.org/spotify/1DB954',
 youtube: 'https://cdn.simpleicons.org/youtube/FF0000',
 discord: 'https://cdn.simpleicons.org/discord/5865F2',
 instagram: 'https://cdn.simpleicons.org/instagram/E4405F',
 twitter: 'https://cdn.simpleicons.org/x/white',
 letterboxd: 'https://cdn.simpleicons.org/letterboxd/00D735',
 onlyfans: 'https://cdn.simpleicons.org/onlyfans/00AFF0',
 behance: 'https://cdn.simpleicons.org/behance/1769FF',
 pinterest: 'https://cdn.simpleicons.org/pinterest/BD081C',
 tumblr: 'https://cdn.simpleicons.org/tumblr/36465D',
 vercel: 'https://cdn.simpleicons.org/vercel/white'
};

function getSpotifyEmbed(url) {
 if (!url) return '';
 const match = url.match(/spotify\.com\/(track|album|playlist|artist)\/([a-zA-Z0-9]+)/);
 if (match) {
  return `<div class="embed-wrapper"><iframe src="https://open.spotify.com/embed/${match[1]}/${match[2]}?utm_source=generator&theme=0" height="80" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>`;
 }
 return '';
}

function getYoutubeEmbed(url) {
 if (!url) return '';
 let id = '';
 if (url.includes('v=')) id = url.split('v=')[1]?.split('&')[0];
 else if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1]?.split('?')[0];
 if (id) {
  return `<div class="embed-wrapper"><iframe src="https://www.youtube.com/embed/${id}" height="180" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
 }
 return '';
}

function getInstagramEmbed(url) {
 if (!url) return '';
 const match = url.match(/instagram\.com\/(p|reel)\/([a-zA-Z0-9_-]+)/);
 if (match) {
  return `<div class="embed-wrapper"><iframe src="https://www.instagram.com/${match[1]}/${match[2]}/embed" height="360" frameborder="0" scrolling="no" allowtransparency="true"></iframe></div>`;
 }
 return '';
}

function initVisualEffect(effectType) {
  const canvas = document.getElementById('effectCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const particles = [];
  const count = effectType === 'stellar_dust' ? 70 : effectType === 'neon_snowfall' ? 50 : 0;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.8,
      speed: Math.random() * 0.6 + 0.3,
      alpha: Math.random() * 0.7 + 0.3,
      phase: Math.random() * Math.PI * 2
    });
  }

  function loop(timestamp) {
    const w = canvas.width;
    const h = canvas.height;
    if (effectType === 'stellar_dust') {
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        const flicker = 0.35 + Math.abs(Math.sin(timestamp * 0.001 + p.phase)) * 0.65;
        ctx.fillStyle = `rgba(255,255,255,${flicker * 0.65})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    } else if (effectType === 'neon_snowfall') {
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        p.y += p.speed;
        p.x += Math.sin(p.y * 0.012) * 0.35;
        if (p.y > h) { p.y = -3; p.x = Math.random() * w; }
        ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (effectType === 'matrix_glitch') {
      ctx.clearRect(0, 0, w, h);
      if (Math.random() < 0.045) {
        const y = Math.random() * h;
        const width = 10 + Math.random() * w * 0.35;
        const x = Math.random() * (w - width);
        ctx.fillStyle = `rgba(255,255,255,${0.15 + Math.random() * 0.4})`;
        ctx.fillRect(x, y, width, 1 + Math.random() * 2);
      }
    } else {
      ctx.clearRect(0, 0, w, h);
      return;
    }
    requestAnimationFrame(loop);
  }
  if (effectType && effectType !== 'none') requestAnimationFrame(loop);
}

async function loadPublicProfile() {
  let retries = 0;
  while ((!window.islySupabase || typeof window.islySupabase.getProfileByHandle !== 'function') && retries < 20) {
    await new Promise(r => setTimeout(r, 100));
    retries++;
  }

  const params = new URLSearchParams(window.location.search);
  let handle = params.get('u') || window.location.pathname.split('/').pop().replace('sly-', '');

  if (!handle) {
    document.getElementById('pubName').textContent = 'Perfil não encontrado';
    return;
  }

  let profile = null;
  try {
    profile = await window.islySupabase.getProfileByHandle(handle);
  } catch (e) {
    console.warn("Erro ao buscar perfil:", e);
  }

  if (!profile) {
    document.getElementById('pubName').textContent = 'Usuário não encontrado';
    document.getElementById('pubHandle').textContent = '@' + handle;
    return;
  }

  document.getElementById('pageTitle').textContent = `${profile.name || handle} — ISLY.ME`;

  const nameEl = document.getElementById('pubName');
  nameEl.textContent = profile.name || 'Sem Nome';
  if (profile.name_effect === 'glow') {
    nameEl.classList.add('text-effect-glow');
  } else if (profile.title_color) {
    nameEl.style.color = profile.title_color;
  }

  document.getElementById('pubHandle').textContent = '@' + (profile.handle || handle);
  document.getElementById('pubBio').textContent = profile.bio || '';
  
  const textColor = profile.text_color || '#f6f4ff';
  document.getElementById('pubBio').style.color = textColor;
  document.getElementById('pubHandle').style.color = textColor;

  const avatarEl = document.getElementById('pubAvatar');
  if (profile.avatar_url) {
    avatarEl.innerHTML = `<img src="${profile.avatar_url}" alt="Avatar">`;
  } else {
    avatarEl.textContent = '⌬';
  }

  document.getElementById('pubStatusEmoji').textContent = profile.status_emoji || '🎮';
  document.getElementById('pubStatusText').textContent = `${profile.status_label || 'Jogando'} · ${profile.activity || 'Atividade'}`;

  const card = document.getElementById('profileCard');
  if (profile.card_style === 'glass') {
    card.classList.add('card-style-glass');
  } else {
    card.classList.add('card-style-opaque');
    if (profile.card_bg) card.style.backgroundColor = profile.card_bg;
  }

  if (profile.wallpaper_url) {
    document.body.style.backgroundImage = `linear-gradient(rgba(8, 8, 18, 0.8), rgba(8, 8, 18, 0.8)), url('${profile.wallpaper_url}')`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
  } else if (profile.bg_color) {
    document.body.style.backgroundColor = profile.bg_color;
  }

  if (profile.visual_effect) {
    initVisualEffect(profile.visual_effect);
  }

  // Emblemas
  const emPreview = document.getElementById('pubEmblems');
  if (Array.isArray(profile.emblems)) {
    emPreview.innerHTML = profile.emblems.map(id => {
      const cleanId = String(id).toLowerCase().trim();
      const emoji = emblemEmojis[cleanId] || '✨';
      const name = emblemNames[cleanId] || cleanId;
      return `<span><span style="font-size: 12px; line-height: 1;">${emoji}</span>${name}</span>`;
    }).join('');
  }

  // Redes Sociais com as logos oficiais atualizadas
  const socPreview = document.getElementById('pubSocials');
  let socHTML = '';
  if (profile.socials && typeof profile.socials === 'object') {
    Object.keys(socialLogos).forEach(key => {
      const val = profile.socials[key];
      if (val) {
        socHTML += `
         <a class="preview-social-icon" title="${key}" href="#" onclick="return false;">
          <img src="${socialLogos[key]}" alt="${key}">
         </a>`;
      }
    });
  }
  socPreview.innerHTML = socHTML;

  // Embeds
  const embedsPreview = document.getElementById('pubEmbeds');
  let embedsHTML = '';
  embedsHTML += getSpotifyEmbed(profile.embed_spotify);
  embedsHTML += getYoutubeEmbed(profile.embed_youtube);
  embedsHTML += getInstagramEmbed(profile.embed_instagram);
  embedsPreview.innerHTML = embedsHTML;

  // Friendships
  const previewWrapperEl = document.getElementById('pubFriendshipsWrapper');
  const previewFriendsEl = document.getElementById('pubFriendships');
  if (previewWrapperEl && previewFriendsEl && Array.isArray(profile.friendships) && profile.friendships.length > 0) {
    previewWrapperEl.style.display = 'flex';
    previewFriendsEl.innerHTML = profile.friendships.map(f => `
      <div class="preview-friend-bubble" title="@${f}">@${f.substring(0,2).toUpperCase()}</div>
    `).join('');
  }
}

if (window.__islySdkReadyFired) {
  loadPublicProfile();
} else {
  window.addEventListener('isly-sdk-ready', loadPublicProfile);
  document.addEventListener('DOMContentLoaded', loadPublicProfile);
}
</script>
</body>
</html>
