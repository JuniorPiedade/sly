:root{color-scheme:dark;--bg:#080812;--panel:#11111f;--line:#292944;--text:#f6f4ff;--muted:#a6a4c4;--purple:#a855f7;--blue:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow-x:hidden;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.6;background:var(--bg);color:var(--text);user-select:none; position: relative;}

/* --- CANVAS DE EFEITOS VISUAIS DE FUNDO --- */
#effectCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 0;
}

/* Garante que o conteúdo fique acima do canvas */
.page-wrapper, .guestbook-trigger-btn, header.fixed, .splash-overlay {
  position: relative;
  z-index: 10;
}

/* --- TELA DE ENTRADA (SPLASH SCREEN) --- */

.splash-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  width: 100%;
  height: 100%;
  background: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 1;
  visibility: visible;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}
.splash-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.splash-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  pointer-events: none;
}
.splash-star-wrapper {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: rgba(168, 85, 247, 0.08);
  border: 1px solid rgba(168, 85, 247, 0.3);
  display: grid;
  place-items: center;
  box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
  animation: splashPulse 2s infinite ease-in-out;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.splash-star-wrapper:hover {
  transform: scale(1.12);
  border-color: rgba(168, 85, 247, 0.9);
  box-shadow: 0 0 45px rgba(168, 85, 247, 0.6);
}
.splash-neon-star {
  width: 28px;
  height: 28px;
  fill: #ffffff;
  stroke: #ffffff;
  stroke-width: 1.5;
  filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
  transition: fill 0.2s ease, stroke 0.2s ease;
}
.splash-star-wrapper:hover .splash-neon-star {
  fill: #c084fc;
  stroke: #c084fc;
  filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.9));
}


.splash-text {
  font-family: Inter, Arial, sans-serif;
 font-size: clamp(16px, 2.5vw, 24px);
  font-weight: 900;
  letter-spacing: 3px;
  line-height: 1.15;
  text-align: center;
  text-transform: none;
  color: #ffffff;

  text-shadow:
  0 0 5px rgba(255, 255, 255, 0.45),
  0 0 12px rgba(255, 255, 255, 0.22);

  cursor: pointer;
  user-select: none;
  padding: 24px;
  max-width: 100%;
  overflow-wrap: anywhere;

  transition:
    color 0.25s ease,
    text-shadow 0.25s ease,
    transform 0.25s ease;
}

.splash-text:hover {
  color: #ffffff;
  text-shadow:
  0 0 7px rgba(255, 255, 255, 0.65),
  0 0 18px rgba(255, 255, 255, 0.35);

  transform: scale(1.03);
}


@keyframes splashPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(168, 85, 247, 0.2); }
  50% { transform: scale(1.06); box-shadow: 0 0 40px rgba(168, 85, 247, 0.4); }
}

/* WRAPPER PRINCIPAL PARA POSICIONAR O CARD */
.page-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  padding-top: 70px;
  box-sizing: border-box;
}

.container{width:100%;max-width:560px;position:relative}

.profile-card{
  opacity: 0;
  overflow: visible !important;
  border-radius:22px;
  width:100%;
  max-width:560px;
  margin:0 auto;
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
  padding:24px 26px;
  transform-style:preserve-3d;
  perspective:1200px;
  transition: opacity 0.4s ease, transform 0.15s ease-out;
  background-size:cover;
  background-position:center;
  border: none !important;
}

/* SLYE — área visual do banner */
.profile-card.align-left #profileBanner {
  grid-column: 1 / -1;
  grid-row: 1;
  width: 100%;
  min-width: 0;
  height: auto;
  min-height: 150px;
  align-self: stretch;
  margin: 0;
  box-sizing: border-box;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  background-clip: padding-box;
  border-radius: 16px;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}

/* SLYE — proteção de leitura do banner */
.profile-card.align-left #profileBanner::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background: linear-gradient(
  90deg,
  rgba(5, 5, 8, 0.38) 0%,
  rgba(5, 5, 8, 0.18) 45%,
  rgba(5, 5, 8, 0.04) 100%
   );
  }
  
/* SLYE — moldura interna 3D do banner */
.profile-card.align-left #profileBanner::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 10px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.16),
    inset 0 -1px 0 rgba(0, 0, 0, 0.35);
  pointer-events: none;
  z-index: 1;
}
  
 /* SLYE — layout do perfil alinhado à esquerda */
.profile-card.align-left {
  position: relative;
  text-align: left;
  display: grid;
  grid-template-columns: minmax(110px, 0.65fr) minmax(0, 1.35fr);
  align-items: start;
  gap: 5px 18px;
}

  /* Cabeçalho: foto, nome, usuário e cargo */
.profile-card.align-left .profile-header-row {
  grid-column: 1 / -1;

  padding: 2px 125px 0 0;
  box-sizing: border-box;
}
/* SLYE — cabeçalho sobre o banner */

 grid-row: 3;

.profile-card.align-left #profileBanner[style*="display: block"] ~ .stats-container {

}

.profile-card.align-left #profileBanner[style*="display: block"] ~ .profile-foot {
  grid-row: 11;
}

<script>
// --- SISTEMA DE EFEITOS VISUAIS DE FUNDO (CANVAS) ---
let currentEffectAnimId = null;

function initVisualEffect(effectName) {
  const canvas = document.getElementById('effectCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  if (currentEffectAnimId) {
    cancelAnimationFrame(currentEffectAnimId);
  }

  if (effectName === 'stellar_dust') {
    const particles = Array.from({ length: 70 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.5 + 0.5,
      alpha: Math.random(),
      speed: Math.random() * 0.2 + 0.05
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = canvas.height;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      currentEffectAnimId = requestAnimationFrame(draw);
    }
    draw();

  } else if (effectName === 'neon_snowfall') {
    const flakes = Array.from({ length: 50 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2 + 1,
      speed: Math.random() * 0.8 + 0.3,
      drift: Math.random() * 0.5 - 0.25
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#22d3ee';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#22d3ee';
      flakes.forEach(f => {
        f.y += f.speed;
        f.x += f.drift;
        if (f.y > canvas.height) f.y = 0;
        if (f.x > canvas.width) f.x = 0;
        if (f.x < 0) f.x = canvas.width;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      currentEffectAnimId = requestAnimationFrame(draw);
    }
    draw();

  } else if (effectName === 'matrix_glitch') {
    const fontSize = 14;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array.from({ length: columns }, () => 1);
    const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&';

    function draw() {
      ctx.fillStyle = 'rgba(8, 8, 18, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#a855f7';
      ctx.font = `${fontSize}px monospace`;

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
      currentEffectAnimId = requestAnimationFrame(draw);
    }
    draw();
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

    return `<div class="embed-wrapper"><iframe src="https://open.spotify.com/embed/${match[1]}/${match[2]}?utm_source=generator&theme=0" height="80" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>`;
  }

  return '';
}

function getYoutubeEmbed(url) {
  if (!url) return '';

  let id = '';

  if (url.includes('youtu.be/')) {
    id = url.split('youtu.be/')[1].split(/[?&]/)[0];
  } else if (url.includes('youtube.com/watch')) {
    id = new URL(url).searchParams.get('v') || '';
  } else if (url.includes('youtube.com/embed/')) {
    id = url.split('youtube.com/embed/')[1].split(/[?&]/)[0];
  } else if (url.includes('youtube.com/shorts/')) {
    id = url.split('youtube.com/shorts/')[1].split(/[?&]/)[0];
  }

  if (!id) return '';

  return `<div class="embed-wrapper"><iframe src="https://www.youtube.com/embed/${id}" height="200" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
}
  function getInstagramEmbed(url)
  {
  if (!url) return '';
  const match = url.match(/instagram\.com\/(p|reel)\/([a-zA-Z0-9_-]+)/);
  if (match) {
    return `<div class="embed-wrapper"><iframe src="https://www.instagram.com/${match[1]}/${match[2]}/embed" height="360" frameborder="0" scrolling="no" allowtransparency="true"></iframe></div>`;
  }
  return '';
}

function getYoutubeAudioId(url) {
  if (!url) return null;
  let id = '';
  if (url.includes('v=')) id = url.split('v=')[1]?.split('&')[0];
  else if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1]?.split('?')[0];
  else if (url.includes('embed/')) id = url.split('embed/')[1]?.split('?')[0];
  return id || url;
}

      ctx.fillRect(x, y, barWidth, barHeight);
    }
  }
  drawVisualizer();

  const hypeBtn = document.getElementById('hypeBtn');
  const iconWrapper = document.getElementById('iconWrapper');

  if (hypeBtn && hypeCountEl && iconWrapper) {
    const storageKey = `isly_hyped_${data.id || handle}`;
    if (localStorage.getItem(storageKey) === 'true') {
      hypeBtn.classList.add('hyped');
    }

    hypeBtn.addEventListener('click', async () => {
      if (localStorage.getItem(storageKey) === 'true') return;
      let current = parseInt(hypeCountEl.innerText, 10) || 0;
      let newCount = current + 1;
      localStorage.setItem(storageKey, 'true');
      hypeBtn.classList.add('hyped', 'animate-flash');
      hypeCountEl.innerText = newCount;
      createNeonBurst(iconWrapper);

      try {
        if (window.islySupabase && typeof window.islySupabase.incrementHype === 'function') {
          await window.islySupabase.incrementHype(data.id, current);
        } else {
          await window.islySupabase.saveProfile({ id: data.id, hypes: newCount });
        }
      } catch (err) {
        console.warn("Erro ao salvar hype:", err);
      }
    });
  }

  function createNeonBurst(targetContainer) {
    const particleCount = 10;
    const rect = targetContainer.getBoundingClientRect();
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('span');
      particle.classList.add('particle');
      const size = Math.random() * 2 + 2;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${centerX}px`;
      particle.style.top = `${centerY}px`;
      const angle = Math.random() * Math.PI * 2;
      const velocity = Math.random() * 30 + 15;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity;
      particle.style.setProperty('--tx', `${tx}px`);
      particle.style.setProperty('--ty', `${ty}px`);
      targetContainer.appendChild(particle);
      setTimeout(() => particle.remove(), 500);
    }
  }
});
</script>
