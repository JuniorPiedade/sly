<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080812">
<title id="pageTitle">isly.me — Perfil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  if (typeof supabase === 'undefined') {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
  }
</script>
<style>
:root{color-scheme:dark;--bg:#080812;--panel:#11111f;--line:#292944;--text:#f6f4ff;--muted:#a6a4c4;--purple:#a855f7;--blue:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow-x:hidden;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.6;background:var(--bg);color:var(--text)}
.container{width:100%;max-width:640px}

.profile-card{
  overflow: visible !important;
  border-radius:28px;
  width:100%;
  max-width:640px;
  margin:0 auto;
  box-shadow:0 24px 70px rgba(0,0,0,0.6);
  padding:36px;
  text-align:left;
  transform-style:preserve-3d;
  perspective:1200px;
  transition:transform 0.15s ease-out;
  background-size:cover;
  background-position:center;
  display:flex;
  flex-direction:column;
  gap:20px;
  border: none !important;
}

.card-style-opaque { background-color: #11111f; }
.card-style-glass {
  background: rgba(13, 11, 20, 0.25) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border: 1px solid rgba(255, 255, 255, 0.12) !important;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5) !important;
}
.profile-header-row {
  display: flex;
  align-items: center;
  gap: 18px;
  overflow: visible !important;
}

.avatar-container {
  position: relative;
  width: 76px;
  height: 76px;
  flex-shrink: 0;
  display: block;
}

.avatar {
  width: 100% !important;
  height: 100% !important;
  border-radius: 20px;
  background: linear-gradient(145deg, #8b5cf6, #4c1d95);
  overflow: hidden;
  position: relative;
  z-index: 1;
  display: block;
  padding: 0 !important;
  margin: 0 !important;
}

.avatar img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  display: block !important;
  border-radius: inherit !important;
}

.avatar-frame {
  position: absolute;
  inset: -6px;
  pointer-events: none;
  z-index: 2;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
.frame-cyberpunk { border: 2px solid var(--blue); border-radius: 22px; box-shadow: 0 0 12px var(--blue); }
.frame-neon-gold { border: 2px solid #facc15; border-radius: 22px; box-shadow: 0 0 12px #facc15; }
.frame-royal-purple { border: 2px solid #c084fc; border-radius: 22px; box-shadow: 0 0 12px #c084fc; }

.profile-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  overflow: visible !important;
}

.profile-card h3{
  margin:0 0 2px;
  font-size:24px;
  font-weight:800;
  letter-spacing:-0.01em;
  white-space:nowrap;
  overflow: visible !important;
  text-overflow: clip;
}

.text-effect-glow {
  color: #ffffff !important;
  text-shadow: 
    0 0 5px rgba(255, 255, 255, 0.9),
    0 0 10px rgba(255, 255, 255, 0.7),
    0 0 20px rgba(255, 255, 255, 0.5),
    0 0 35px rgba(255, 255, 255, 0.3);
}

.handle{font-size:13px;font-weight:600;letter-spacing:0.02em;margin-bottom:4px}
.role-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(139,92,246,0.15);border:1px solid rgba(139,92,246,0.35);color:#c084fc;width:fit-content}

.bio-preview{font-size:13px;margin:4px 0 0;overflow-wrap:anywhere;line-height:1.5}
.live-status{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid rgba(34,211,238,0.3);background:rgba(34,211,238,0.08);color:#cffafe;border-radius:999px;font-size:11px;font-weight:600;margin:4px 0 0;width:fit-content}
.preview-emblems{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.preview-emblems span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid rgba(168,85,247,0.25);background:rgba(168,85,247,0.08);border-radius:99px;font-size:11px;font-weight:600;color:#ddd6fe}
.preview-emblems svg{width:14px;height:14px;fill:currentColor}

.public-socials{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.social-icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);text-decoration:none;transition:.2s}
.social-icon-btn svg{width:16px;height:16px;fill:currentColor}
.social-icon-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.08)}

.embeds-container{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.embed-wrapper{width:100%;border-radius:14px;overflow:hidden;background:#00000033;line-height:0}
.embed-wrapper iframe{width:100%;border:0;display:block}

.public-links{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.public-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-radius:14px;font-size:13px;font-weight:700;text-align:left;text-decoration:none;transition:all .25s ease;cursor:pointer;background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12)}
.public-link:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.4)}
.public-link .left{display:flex;align-items:center;gap:10px;min-width:0}
.public-link .left span:last-child{overflow:hidden;text-overflow:ellipsis}

.views-counter{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:16px;font-size:12px;color:var(--muted)}
.views-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(10px);color:#c9c5e2;font-weight:600}

.profile-foot{font-size:10px;color:#777391;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;padding:14px 0 18px;text-align:center;border-top:1px solid rgba(255,255,255,0.08);margin-top:6px}
.error-box{text-align:center;padding:30px;color:#fcd9a1}

/* =========================================================
   PLAYER DE TRILHA SONORA (MINIMALISTA, TRANSLÚCIDO E DISCRETO)
   ========================================================= */
#soundtrackWidget {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  background: rgba(13, 11, 20, 0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 99px;
  padding: 6px 14px 6px 6px;
  align-items: center;
  gap: 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  transition: all 0.25s ease;
}
#soundtrackWidget:hover {
  background: rgba(13, 11, 20, 0.65);
  border-color: rgba(255, 255, 255, 0.15);
}
#stPlayBtn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f6f4ff;
  cursor: pointer;
  font-size: 10px;
  padding: 0;
  line-height: 1;
  flex-shrink: 0;
  transition: background 0.2s, transform 0.2s, border-color 0.2s;
}
#stPlayBtn:hover {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.25);
  transform: scale(1.05);
}
.st-info { display: flex; flex-direction: column; text-align: left; }
.st-title {
  font-size: 11px;
  color: #f6f4ff;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.st-status { font-size: 9px; color: var(--muted); letter-spacing: 0.3px; }

/* ========================================================= */
/* GUESTBOOK (MURAL DE RECADOS ESTILO POST-IT / MARGENS)     */
/* ========================================================= */
#guestbookContainer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  overflow: hidden;
}

.guestbook-note {
  position: absolute;
  pointer-events: auto;
  padding: 10px 14px;
  max-width: 140px;
  font-size: 11px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
  transition: transform 0.2s ease, z-index 0.2s ease;
  cursor: default;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.guestbook-note:hover {
  transform: scale(1.08) rotate(0deg) !important;
  z-index: 1000;
}

.note-style-vintage {
  background: #fdfbf7;
  color: #1a1a1a;
  border-left: 3px solid #d4c5a9;
  font-family: 'Courier New', Courier, monospace;
  box-shadow: 2px 4px 15px rgba(0,0,0,0.3);
}

.note-style-chalk {
  background: rgba(18, 18, 26, 0.85);
  backdrop-filter: blur(8px);
  color: #e2e8f0;
  border: 1px dashed rgba(255, 255, 255, 0.25);
  font-family: 'Comic Sans MS', cursive, sans-serif;
  letter-spacing: 0.5px;
}

.note-style-dev {
  background: #ffffff;
  color: #0f172a;
  border-radius: 4px;
  border: 1px solid #e2e8f0;
  font-family: 'Times New Roman', Times, serif;
}
.note-style-dev .note-code-tag {
  font-size: 9px;
  color: #64748b;
  font-family: monospace;
}

.note-author {
  font-size: 9px;
  font-weight: 700;
  opacity: 0.7;
  text-transform: uppercase;
}

/* Botão minimalista sem ícone de lápis */
#openNoteModalBtn {
  position: fixed;
  bottom: 24px;
  left: 24px;
  z-index: 1000;
  background: rgba(13, 11, 20, 0.6);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #f6f4ff;
  border-radius: 99px;
  padding: 8px 16px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  transition: all 0.2s;
}
#openNoteModalBtn:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: translateY(-2px);
}

#noteModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 9999;
  place-items: center;
  padding: 20px;
}
.note-modal-box {
  background: #11111f;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  width: 100%;
  max-width: 340px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}
.note-modal-box h3 { margin: 0; font-size: 16px; color: #f6f4ff; }
.note-modal-box input, .note-modal-box select {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px 14px;
  color: #fff;
  font-size: 13px;
  outline: none;
}
.note-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.note-btn {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: none;
}
.note-btn-cancel { background: rgba(255,255,255,0.08); color: #a6a4c4; }
.note-btn-submit { background: #a855f7; color: #fff; }

.animate-item { opacity: 0; transform: translateY(16px); animation: cascadeIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes cascadeIn { to { opacity: 1; transform: translateY(0); } }
.delay-1 { animation-delay: 0.05s; }
.delay-2 { animation-delay: 0.12s; }
.delay-3 { animation-delay: 0.18s; }
.delay-4 { animation-delay: 0.24s; }
.delay-5 { animation-delay: 0.30s; }
.delay-6 { animation-delay: 0.36s; }
.delay-7 { animation-delay: 0.42s; }
.delay-8 { animation-delay: 0.48s; }
</style>
</head>
<body>
<div class="container">
  <div class="profile-card card-style-opaque" id="profileCard">
    <div class="profile-header-row animate-item delay-1">
      <div class="avatar-container">
        <div class="avatar" id="avatar">⌬</div>
        <div id="avatarFrame" class="avatar-frame"></div>
      </div>
      <div class="profile-info">
        <h3 id="name">Carregando...</h3>
        <div class="handle" id="handle">@...</div>
        <div class="role-badge" id="roleBadge">👾 Membro</div>
      </div>
    </div>
    <p class="bio-preview animate-item delay-2" id="bio"></p>
    <div class="live-status animate-item delay-3" id="statusBox"><span id="statusEmoji">🎮</span><span id="statusText">Buscando universo...</span></div>
    <div class="preview-emblems animate-item delay-3" id="emblems"></div>
    <div class="public-socials animate-item delay-3" id="socialsBar"></div>
    <div class="embeds-container animate-item delay-4" id="embedsBar"></div>
    <div class="public-links animate-item delay-4" id="links"></div>
    <div class="profile-foot animate-item delay-5"><a href="landing.html" style="color:inherit">CRIADO NO ISLY.ME ✦</a></div>
  </div>

  <div class="views-counter animate-item delay-6">
    <div class="views-badge">
      <span>👁️</span>
      <span id="publicViewsCount">0</span>
      <span>visualizações</span>
    </div>
  </div>
</div>

<!-- Widget Flutuante de Trilha Sonora -->
<div id="soundtrackWidget">
  <button id="stPlayBtn" aria-label="Tocar Trilha Sonora">▶</button>
  <div class="st-info">
    <span class="st-title">🎵 Trilha Sonora</span>
    <span class="st-status" id="stStatus">Pausado</span>
  </div>
  <audio id="stAudio" preload="none" loop></audio>
</div>

<!-- Container dos recados nas margens -->
<div id="guestbookContainer"></div>

<!-- Botão flutuante limpo para abrir o modal -->
<button id="openNoteModalBtn" aria-label="Deixar Recado">Deixar Recado</button>

<!-- Modal -->
<div id="noteModal">
  <div class="note-modal-box">
    <h3>Deixar um recado no mural</h3>
    <p style="font-size: 11px; color: #a6a4c4; margin: 0;">Até 10 caracteres por campo para manter o espaço limpo.</p>
    <input type="text" id="noteAuthorInput" placeholder="Seu nome (máx 10)" maxlength="20">
    <input type="text" id="noteMessageInput" placeholder="Recado (máx 10)" maxlength="20">
    <div class="note-modal-actions">
      <button class="note-btn note-btn-cancel" id="closeNoteModalBtn">Cancelar</button>
      <button class="note-btn note-btn-submit" id="submitNoteBtn">Fixar Recado</button>
    </div>
  </div>
</div>

<script src="js/supabase.js"></script>

function getSpotifyEmbed(url) {
  if (!url) return '';
  const match = url.match(/spotify\.com\/(track|album|playlist|artist)\/([a-zA-Z0-9]+)/);
  if (match) {
    return `<div class="embed-wrapper"><iframe src="https://open.spotify.com/embed/${match[1]}/${match[2]}?utm_source=generator&theme=0" height="80" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>`;
  }
  return '';
}

function getYoutubeEmbed(url) {
  if (!url) return '';
  let id = '';
  if (url.includes('v=')) id = url.split('v=')[1]?.split('&')[0];
  else if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1]?.split('?')[0];
  if (id) {
    return `<div class="embed-wrapper"><iframe src="https://www.youtube.com/embed/${id}" height="180" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  }
  return '';
}

function getInstagramEmbed(url) {
  if (!url) return '';
  const match = url.match(/instagram\.com\/(p|reel)\/([a-zA-Z0-9_-]+)/);
  if (match) {
    return `<div class="embed-wrapper"><iframe src="https://www.instagram.com/${match[1]}/${match[2]}/embed" height="360" frameborder="0" scrolling="no" allowtransparency="true"></iframe></div>`;
  }
  return '';
}

document.addEventListener("DOMContentLoaded", async () => {
  // Configuração global imediata do Modal do Guestbook (independente do carregamento do perfil)
  const modal = document.getElementById('noteModal');
  document.getElementById('openNoteModalBtn').addEventListener('click', () => {
    if (modal) modal.style.display = 'grid';
  });
  document.getElementById('closeNoteModalBtn').addEventListener('click', () => {
    if (modal) modal.style.display = 'none';
  });

  const urlParams = new URLSearchParams(window.location.search);
  const rawHandle = urlParams.get('u') || urlParams.get('user');

  if (!rawHandle || !window.islySupabase) {
    document.querySelector('.container').innerHTML = '<div class="error-box"><h2>Perfil não especificado.</h2><p>Verifique o endereço acessado.</p></div>';
    return;
  }

  const handle = rawHandle.trim().replace(/^@/, '');
  const data = await window.islySupabase.getProfileByHandle(handle);

  if (!data) {
    document.querySelector('.container').innerHTML = `<div class="error-box"><h2>404 — Universo não encontrado</h2><p>O perfil "@${handle}" ainda não foi publicado.</p></div>`;
    return;
  }

  if (data.is_banned) {
    document.querySelector('.container').innerHTML = `
      <div class="error-box" style="border: 1px solid #f8717144; background: #f8717112; border-radius: 18px; padding: 40px;">
        <h2>⚠️ Conta Suspensa</h2>
        <p>Este perfil foi suspenso por violação dos termos de uso da comunidade.</p>
      </div>
    `;
    return;
  }

  let currentViews = (data.views_count || 0) + 1;
  document.getElementById('publicViewsCount').textContent = currentViews;
  try {
    await window.islySupabase.saveProfile({ id: data.id, views_count: currentViews });
  } catch (e) {
    console.warn("Analytics Error:", e);
  }

  document.body.style.backgroundColor = data.bg_color || '#080812';
  if (data.custom_cursor) {
    document.body.style.cursor = `url('${data.custom_cursor}'), auto`;
  }

  const card = document.getElementById('profileCard');
  if (card) {
    const cardStyleType = data.card_style || 'opaque';
    card.classList.remove('card-style-opaque', 'card-style-glass');
    
    if (cardStyleType === 'glass') {
      card.classList.add('card-style-glass');
      card.style.backgroundColor = '';
    } else {
      card.classList.add('card-style-opaque');
      card.style.backgroundColor = data.card_bg || '#11111f';
    }

    if (data.wallpaper_url) {
      document.body.style.backgroundImage = `linear-gradient(rgba(8, 8, 18, 0.75), rgba(8, 8, 18, 0.75)), url('${data.wallpaper_url}')`;
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundRepeat = 'no-repeat';
      document.body.style.backgroundAttachment = 'fixed';
    }

    card.style.border = 'none';

    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const xc = rect.width / 2;
      const yc = rect.height / 2;
      const dx = (x - xc) / xc;
      const dy = (y - yc) / yc;
      card.style.transform = `perspective(1200px) rotateY(${dx * 4}deg) rotateX(${-dy * 4}deg) translateY(-2px)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1200px) rotateY(0deg) rotateX(0deg) translateY(0px)';
    });
  }

  const nameEl = document.getElementById('name');
  if (nameEl) {
    nameEl.style.color = data.title_color || '#ffffff';
    if (data.name_effect === 'glow') {
      nameEl.classList.add('text-effect-glow');
    }
  }

  const activeTextColor = data.text_color || '#f6f4ff';
  const bioEl = document.getElementById('bio');
  if (bioEl) bioEl.style.color = activeTextColor;

  const handleEl = document.getElementById('handle');
  if (handleEl) handleEl.style.color = activeTextColor;

  document.getElementById('pageTitle').textContent = (data.name || handle) + ' — isly.me';
  nameEl.textContent = data.name || 'Sem nome';
  handleEl.textContent = '@' + data.handle;

  const roleBadge = document.getElementById('roleBadge');
  if (roleBadge) {
    const r = data.role || 'Membro';
    roleBadge.innerHTML = r === 'Fundador' ? '💎 Fundador' : r === 'Suporte' ? '🛡️ Suporte' : r === 'Apoiador' ? '⭐ Apoiador' : '👾 Membro';
  }

  bioEl.textContent = data.bio || '';
  document.getElementById('statusEmoji').textContent = data.status_emoji || '🎮';
  document.getElementById('statusText').textContent = (data.status_label || 'Jogando') + (data.activity ? ' · ' + data.activity : '');

  const avatarEl = document.getElementById('avatar');
  if (data.avatar_url) {
    avatarEl.innerHTML = `<img src="${data.avatar_url}" alt="${data.name || 'Avatar'}">`;
  } else {
    avatarEl.textContent = '⌬';
  }

  const frameEl = document.getElementById('avatarFrame');
  const frameType = data.avatar_frame || 'none';
  frameEl.className = 'avatar-frame';
  if (frameType === 'cyberpunk') frameEl.classList.add('frame-cyberpunk');
  else if (frameType === 'neon-gold') frameEl.classList.add('frame-neon-gold');
  else if (frameType === 'royal-purple') frameEl.classList.add('frame-royal-purple');

  const emblemsEl = document.getElementById('emblems');
  if (emblemsEl) {
    emblemsEl.innerHTML = (data.emblems || []).map(id => {
      const svg = emblemSvgs[id] || '';
      return `<span>${svg} ${emblemNames[id] || id}</span>`;
    }).join('');
  }

  const socialsBar = document.getElementById('socialsBar');
  if (socialsBar && data.socials) {
    let sHTML = '';
    Object.keys(data.socials).forEach(key => {
      const val = data.socials[key];
      if (val && socialUrls[key]) {
        const url = socialUrls[key](val);
        const svg = socialSvgs[key] || '';
        sHTML += `<a class="social-icon-btn" href="${url}" target="_blank" rel="noopener" title="${key}" style="color:${activeTextColor}">${svg}</a>`;
      }
    });
    socialsBar.innerHTML = sHTML;
  }

  const embedsBar = document.getElementById('embedsBar');
  if (embedsBar) {
    let eHTML = '';
    eHTML += getSpotifyEmbed(data.embed_spotify);
    eHTML += getYoutubeEmbed(data.embed_youtube);
    eHTML += getInstagramEmbed(data.embed_instagram);
    embedsBar.innerHTML = eHTML;
  }

  const linksEl = document.getElementById('links');
  if (linksEl) {
    linksEl.innerHTML = (data.links || []).map(link => `
      <a class="public-link" data-url="${link.url || '#'}" target="_blank" rel="noopener" style="background:rgba(255,255,255,0.06); color:${activeTextColor}; border:1px solid rgba(255,255,255,0.12); backdrop-filter:blur(12px)">
        <span class="left"><span>${link.emoji || '↗'}</span><span>${link.title || 'Link'}</span></span>
        <span class="arr" style="color:${activeTextColor}">↗</span>
      </a>
    `).join('');

    document.querySelectorAll('.public-link').forEach(linkBtn => {
      linkBtn.addEventListener('click', async (evt) => {
        evt.preventDefault();
        const targetUrl = linkBtn.getAttribute('data-url');
        try {
          const currentClicks = (data.clicks_count || 0) + 1;
          await window.islySupabase.saveProfile({ id: data.id, clicks_count: currentClicks });
        } catch (e) {
          console.warn("Analytics Error:", e);
        }
        if (targetUrl && targetUrl !== '#') window.open(targetUrl, '_blank');
      });
    });
  }

  // ATIVAÇÃO DA TRILHA SONORA
  if (data.soundtrack_url) {
    const widget = document.getElementById('soundtrackWidget');
    const audio = document.getElementById('stAudio');
    const playBtn = document.getElementById('stPlayBtn');
    const statusTxt = document.getElementById('stStatus');

    if (widget && audio) {
      audio.src = data.soundtrack_url;
      widget.style.display = 'flex';

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play().then(() => {
            playBtn.textContent = '❚❚';
            statusTxt.textContent = 'A tocar...';
          }).catch(err => {
            console.warn("Erro ao reproduzir áudio:", err);
          });
        } else {
          audio.pause();
          playBtn.textContent = '▶';
          statusTxt.textContent = 'Pausado';
        }
      });
    }
  }

  // Lógica de Carregamento e Posicionamento do Guestbook nas Margens
  const container = document.getElementById('guestbookContainer');
  const profileId = data.id;
  const globalStyle = data.guestbook_style || 'vintage';

  function getRandomSafePosition() {
    let x, y;
    const isLeftSide = Math.random() < 0.5;
    
    if (isLeftSide) {
      x = Math.floor(Math.random() * 20) + 2;
    } else {
      x = Math.floor(Math.random() * 20) + 75;
    }
    y = Math.floor(Math.random() * 75) + 10;
    return { x, y };
  }

  async function loadNotes() {
    try {
      const { data: notes, error } = await window.islySupabase.client
        .from('guestbook_notes')
        .select('*')
        .eq('profile_id', profileId)
        .order('created_at', { ascending: false })
        .limit(16);

      if (error) throw error;
      container.innerHTML = '';

      if (notes) {
        notes.forEach(note => {
          const el = document.createElement('div');
          el.className = `guestbook-note note-style-${note.style || globalStyle}`;
          
          const rot = Math.floor(Math.random() * 12) - 6;
          el.style.left = `${note.pos_x}%`;
          el.style.top = `${note.pos_y}%`;
          el.style.transform = `rotate(${rot}deg)`;

          let innerHTML = `<span class="note-author">@${escapeHtml(note.author)}</span>`;
          if (note.style === 'dev' || globalStyle === 'dev') {
            innerHTML += `<span class="note-code-tag">// msg</span>`;
          }
          innerHTML += `<span>${escapeHtml(note.message)}</span>`;

          el.innerHTML = innerHTML;
          container.appendChild(el);
        });
      }
    } catch (e) {
      console.warn("Erro ao carregar guestbook:", e);
    }
  }

  function escapeHtml(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  loadNotes();

  // Envio do Recado
  document.getElementById('submitNoteBtn').addEventListener('click', async () => {
    const author = document.getElementById('noteAuthorInput').value.trim();
    const message = document.getElementById('noteMessageInput').value.trim();

    if (!author || !message) {
      alert('Preencha ambos os campos (máximo de 10 caracteres cada).');
      return;
    }

    const pos = getRandomSafePosition();

    try {
      const { error } = await window.islySupabase.client
        .from('guestbook_notes')
        .insert([{
          profile_id: profileId,
          author: author.substring(0, 20),
          message: message.substring(0, 20),
          style: globalStyle,
          pos_x: pos.x,
          pos_y: pos.y
        }]);

      if (error) throw error;

      modal.style.display = 'none';
      document.getElementById('noteAuthorInput').value = '';
      document.getElementById('noteMessageInput').value = '';
      loadNotes();
    } catch (e) {
      alert('Erro ao fixar recado. Tente novamente.');
      console.error(e);
    }
  });
});
</script>
