<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080812">
<title id="pageTitle">isly.me — Perfil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  if (typeof supabase === 'undefined') {

<style>
:root{color-scheme:dark;--bg:#080812;--panel:#11111f;--line:#292944;--text:#f6f4ff;--muted:#a6a4c4;--purple:#a855f7;--blue:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow-x:hidden;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.6;background:var(--bg);color:var(--text)}
.container{width:100%;max-width:640px;position:relative}

.profile-card{
  overflow: visible !important;
  border-radius:28px;
  width:100%;
  max-width:640px;
  margin:0 auto;
  box-shadow:0 24px 70px rgba(0,0,0,0.6);
  padding:36px;
  text-align:left;
  transform-style:preserve-3d;
  perspective:1200px;
  transition:transform 0.15s ease-out;
  background-size:cover;
  background-position:center;
  display:flex;
  flex-direction:column;
  gap:20px;
  border: none !important;
}

.card-style-opaque { background-color: #11111f; }
.card-style-glass {
  background: rgba(13, 11, 20, 0.25) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border: 1px solid rgba(255, 255, 255, 0.12) !important;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5) !important;
}
.profile-header-row {
  display: flex;
  align-items: center;
  gap: 18px;
  overflow: visible !important;
}

.avatar-container {
  position: relative;
  width: 76px;
  height: 76px;
  flex-shrink: 0;
  display: block;
}

.avatar {
  width: 100% !important;
  height: 100% !important;
  border-radius: 20px;
  background: linear-gradient(145deg, #8b5cf6, #4c1d95);
  overflow: hidden;
  position: relative;
  z-index: 1;
  display: block;
  padding: 0 !important;
  margin: 0 !important;
}

.avatar img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  display: block !important;
  border-radius: inherit !important;
}

.avatar-frame {
  position: absolute;
  inset: -6px;
  pointer-events: none;
  z-index: 2;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
.frame-neon-white { border: 2px solid #ffffff; border-radius: 22px; box-shadow: 0 0 12px rgba(255, 255, 255, 0.8), inset 0 0 8px rgba(255, 255, 255, 0.4); }
.frame-vip { border: 2px solid var(--purple); border-radius: 22px; box-shadow: 0 0 16px var(--purple), 0 0 30px var(--blue); }

.profile-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  overflow: visible !important;
}

.profile-card h3{
  margin:0 0 2px;
  font-size:24px;
  font-weight:800;
  letter-spacing:-0.01em;
  white-space:nowrap;
  overflow: visible !important;
  text-overflow: clip;
}

.text-effect-glow {
  color: #ffffff !important;
  text-shadow: 
    0 0 5px rgba(255, 255, 255, 0.9),
    0 0 10px rgba(255, 255, 255, 0.7),
    0 0 20px rgba(255, 255, 255, 0.5),
    0 0 35px rgba(255, 255, 255, 0.3);
}

.handle{font-size:13px;font-weight:600;letter-spacing:0.02em;margin-bottom:4px}
.role-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(139,92,246,0.15);border:1px solid rgba(139,92,246,0.35);color:#c084fc;width:fit-content}

.bio-preview{font-size:13px;margin:4px 0 0;overflow-wrap:anywhere;line-height:1.5}
.live-status{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid rgba(34,211,238,0.3);background:rgba(34,211,238,0.08);color:#cffafe;border-radius:999px;font-size:11px;font-weight:600;margin:4px 0 0;width:fit-content}

.preview-emblems {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 4px;
}
.preview-emblems span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #e2dcf0;
  backdrop-filter: blur(8px);
}

.public-socials{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.social-icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);text-decoration:none;transition:.2s}
.social-icon-btn svg{width:16px;height:16px;fill:currentColor}
.social-icon-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.08)}

.embeds-container{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.embed-wrapper{width:100%;border-radius:14px;overflow:hidden;background:#00000033;line-height:0}
.embed-wrapper iframe{width:100%;border:0;display:block}

.public-links{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.public-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-radius:14px;font-size:13px;font-weight:700;text-align:left;text-decoration:none;transition:all .25s ease;cursor:pointer;background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12)}
.public-link:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.4)}
.public-link .left{display:flex;align-items:center;gap:10px;min-width:0}
.public-link .left span:last-child{overflow:hidden;text-overflow:ellipsis}

.friendships-footer-wrapper {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.friendships-footer-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 700;
  color: var(--muted);
  cursor: default;
}
.friendships-footer-container {
  display: flex;
  align-items: center;
  gap: 12px;
}
.friendship-bubble {
  position: relative;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  display: block;
  transition: transform 0.2s ease, border-color 0.2s ease;
  text-decoration: none;
}
.friendship-bubble:hover {
  transform: scale(1.15);
  border-color: var(--purple);
  z-index: 10;
}
.friendship-bubble img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.friendship-bubble-fallback {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--text);
}

.views-counter{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:16px;font-size:12px;color:var(--muted)}
.views-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(10px);color:#c9c5e2;font-weight:600}

.profile-foot{font-size:10px;color:#777391;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;padding:14px 0 18px;text-align:center;border-top:1px solid rgba(255,255,255,0.08);margin-top:6px}
.error-box{text-align:center;padding:30px;color:#fcd9a1}

/* --- BOTÃO MINIMALISTA NO CANTO INFERIOR ESQUERDO --- */
.guestbook-trigger-btn {
  position: fixed;
  bottom: 24px;
  left: 24px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--muted);
  padding: 8px 14px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  z-index: 999;
  backdrop-filter: blur(8px);
  transition: all 0.2s ease;
  letter-spacing: 0.3px;
}
.guestbook-trigger-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.2);
}

/* --- MODAL VINTAGE DE PAPEL RASGADO --- */
.guestbook-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 8, 18, 0.8);
  backdrop-filter: blur(8px);
  display: grid;
  place-items: center;
  z-index: 10000;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.guestbook-modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.guestbook-modal-content {
  background: #14111c;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  width: 100%;
  max-width: 420px;
  padding: 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.scrap-paper {
  position: relative;
  background: #f4ebd0;
  color: #2c251d;
  padding: 14px 16px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 12px;
  line-height: 1.45;
  box-shadow: 2px 4px 12px rgba(0,0,0,0.3);
  border: 1px dashed #d1c29e;
  clip-path: polygon(0% 4%, 3% 0%, 97% 2%, 100% 6%, 98% 95%, 100% 100%, 2% 97%, 0% 94%);
  margin-bottom: 8px;
}
.scrap-author {
  font-size: 10px;
  font-weight: bold;
  color: #6b5b45;
  margin-top: 6px;
  display: block;
  text-align: right;
  border-top: 1px dotted #c9b999;
  padding-top: 4px;
}
.scrap-form textarea {
  width: 100%;
  background: #0a0812;
  border: 1px solid #352f4a;
  border-radius: 10px;
  color: #f6f4ff;
  padding: 10px;
  font-size: 12px;
  resize: none;
  height: 70px;
  outline: none;
}
.scrap-form textarea:focus { border-color: var(--purple); }
.scrap-submit-btn {
  width: 100%;
  margin-top: 8px;
  background: linear-gradient(135deg, #7c3aed, #9333ea);
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 10px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.scrap-submit-btn:hover { opacity: 0.9; }

/* PLAYER DE TRILHA SONORA */
#soundtrackWidget {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  background: rgba(13, 11, 20, 0.45);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 99px;
  padding: 6px 14px 6px 6px;
  align-items: center;
  gap: 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}
#stPlayBtn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f6f4ff;
  cursor: pointer;
  font-size: 10px;
}
.st-info { display: flex; flex-direction: column; text-align: left; }
.st-title { font-size: 11px; color: #f6f4ff; font-weight: 600; }
.st-status { font-size: 9px; color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <div class="profile-card card-style-opaque" id="profileCard">
    <div class="profile-header-row animate-item delay-1">
      <div class="avatar-container">
        <div class="avatar" id="avatar">⌬</div>
        <div id="avatarFrame" class="avatar-frame"></div>
      </div>
      <div class="profile-info">
        <h3 id="name">Carregando...</h3>
        <div class="handle" id="handle">@...</div>
        <div class="role-badge" id="roleBadge">👾 Membro</div>
      </div>
    </div>
    <p class="bio-preview animate-item delay-2" id="bio"></p>
    <div class="live-status animate-item delay-3" id="statusBox"><span id="statusEmoji">🎮</span><span id="statusText">Buscando universo...</span></div>
    <div class="preview-emblems animate-item delay-3" id="emblems"></div>
    <div class="public-socials animate-item delay-3" id="socialsBar"></div>
    <div class="embeds-container animate-item delay-4" id="embedsBar"></div>
    <div class="public-links animate-item delay-4" id="links"></div>
    
    <div id="friendshipsFooterWrapper" class="friendships-footer-wrapper animate-item delay-4" style="display: none;">
      <div class="friendships-footer-title">Amigos Próximos</div>
      <div class="friendships-footer-container" id="friendshipsFooter"></div>
    </div>

    <div class="profile-foot animate-item delay-5"><a href="landing.html" style="color:inherit">CRIADO NO ISLY.ME ✦</a></div>
  </div>

  <div class="views-counter animate-item delay-6">
    <div class="views-badge">
      <span>👁️</span>
      <span id="publicViewsCount">0</span>
      <span>visualizações</span>
    </div>
  </div>
</div>

<!-- BOTÃO DISCRETO NO CANTO INFERIOR ESQUERDO -->
<button type="button" class="guestbook-trigger-btn" id="openGuestbookBtn" style="display: none;">Deixe um recado!</button>

<!-- MODAL DO MURAL DE RECADOS -->
<div class="guestbook-modal-overlay" id="guestbookModal">
  <div class="guestbook-modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <strong style="font-size: 13px; letter-spacing: 1px;">MURAL DE RECADOS 📌</strong>
      <button type="button" id="closeGuestbookBtn" style="background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer;">✕</button>
    </div>

    <div id="scrapsContainer" style="max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;"></div>

    <div class="scrap-form" id="scrapFormArea" style="display: none; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px;">
      <textarea id="scrapMsgInput" maxlength="140" placeholder="Escreva seu recado (máx 140 caracteres)..."></textarea>
      <button type="button" class="scrap-submit-btn" id="sendScrapBtn">Fixar recado</button>
    </div>
  </div>
</div>

<div id="soundtrackWidget">
  <button id="stPlayBtn" aria-label="Tocar Trilha Sonora">▶</button>
  <div class="st-info">
    <span class="st-title">🎵 Trilha Sonora</span>
    <span class="st-status" id="stStatus">Pausado</span>
  </div>
  <audio id="stAudio" preload="none" loop></audio>
</div>
