<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080812">
<title id="pageTitle">isly.me — Perfil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  if (typeof supabase === 'undefined') {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
  }
</script>
<style>
:root{color-scheme:dark;--bg:#080812;--panel:#11111f;--line:#292944;--text:#f6f4ff;--muted:#a6a4c4;--purple:#a855f7;--blue:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;overflow-x:hidden;font-family:Inter,sans-serif}
.container{width:100%;max-width:420px}

.profile-card{
  overflow:hidden;
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  text-align:center;
  transition:transform .3s;
}

.cover{height:94px;position:relative;background:radial-gradient(circle at 75% 20%,rgba(34,211,238,0.5),transparent 30%),radial-gradient(circle at 22% 100%,rgba(192,132,252,0.6),transparent 45%),linear-gradient(120deg,#25104a,#13152d);background-size:cover;background-position:center}

.avatar{width:80px;height:80px;margin:-40px auto 10px;position:relative;display:grid;place-items:center;border:3px solid #131221;border-radius:24px;background:linear-gradient(135deg,#9333ea,#2563eb);box-shadow:0 0 30px rgba(147,51,234,0.45);font-size:32px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

.profile-card h3{margin:7px 0 1px;font-size:20px;letter-spacing:-0.02em}
.verified{color:var(--blue);font-size:12px}
.handle{font-size:11px;font-weight:600;letter-spacing:0.02em}
.role-badge{display:inline-block;margin:6px 0 4px;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(139,92,246,0.15);border:1px solid rgba(139,92,246,0.35);color:#c084fc}
.bio-preview{font-size:11px;margin:10px 18px 12px;overflow-wrap:anywhere;line-height:1.5}
.live-status{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(34,211,238,0.3);background:rgba(34,211,238,0.08);color:#cffafe;border-radius:999px;font-size:10px;margin:0 auto 14px;max-width:90%}
.preview-emblems{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:0 14px 13px}
.preview-emblems span{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border:1px solid rgba(168,85,247,0.25);background:rgba(168,85,247,0.08);border-radius:8px;font-size:9px;color:#ddd6fe}

.public-links{padding:0 14px 18px}
.public-link{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding:12px 14px;border-radius:12px;font-size:11px;font-weight:700;text-align:left;text-decoration:none;transition:all .25s ease;cursor:pointer}
.public-link:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.3)}
.public-link .left{display:flex;align-items:center;gap:10px;min-width:0}
.public-link .left span:last-child{overflow:hidden;text-overflow:ellipsis}

.views-counter{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:14px;font-size:11px;color:var(--muted)}
.views-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(10px);color:#c9c5e2;font-weight:600}

.profile-foot{font-size:9px;color:#777391;letter-spacing:.13em;padding:12px 0 16px;text-align:center}
.error-box{text-align:center;padding:30px;color:#fcd9a1}

.animate-item {
  opacity: 0;
  transform: translateY(16px);
  animation: cascadeIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes cascadeIn { to { opacity: 1; transform: translateY(0); } }
.delay-1 { animation-delay: 0.05s; }
.delay-2 { animation-delay: 0.12s; }
.delay-3 { animation-delay: 0.18s; }
.delay-4 { animation-delay: 0.24s; }
.delay-5 { animation-delay: 0.30s; }
.delay-6 { animation-delay: 0.36s; }
.delay-7 { animation-delay: 0.42s; }
.delay-8 { animation-delay: 0.48s; }
</style>
</head>
<body>
<div class="container">
  <div class="profile-card" id="profileCard">
    <div class="cover animate-item delay-1"></div>
    <div class="avatar animate-item delay-2" id="avatar">👾</div>
    <h3 class="animate-item delay-3" id="name">Carregando... <span class="verified">✦</span></h3>
    <div class="handle animate-item delay-3" id="handle">@...</div>
    <div class="role-badge animate-item delay-4" id="roleBadge">💎 Fundador</div>
    <p class="bio-preview animate-item delay-4" id="bio"></p>
    <div class="live-status animate-item delay-5" id="statusBox"><span id="statusEmoji">🎮</span><span id="statusText">Buscando universo...</span></div>
    <div class="preview-emblems animate-item delay-5" id="emblems"></div>
    <div class="public-links animate-item delay-6" id="links"></div>
  </div>

  <div class="views-counter animate-item delay-7">
    <div class="views-badge">
      <span>👁️</span>
      <span id="publicViewsCount">0</span>
      <span>visualizações</span>
    </div>
  </div>

  <div class="profile-foot animate-item delay-8"><a href="landing.html" style="color:inherit">CRIADO NO ISLY.ME ✦</a></div>
</div>

<script src="js/supabase.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const rawHandle = urlParams.get('u') || urlParams.get('user');

  const emblemInfo = {
    gamer: {emoji: '🎮', name: 'Gamer'}, geek: {emoji: '👾', name: 'Geek'},
    rpg: {emoji: '🐉', name: 'Mestre do RPG'}, anime: {emoji: '🍥', name: 'Anime lover'},
    artist: {emoji: '🎨', name: 'Criador'}, founder: {emoji: '💎', name: 'Fundador'}
  };

  if (!rawHandle || !window.islySupabase) {
    document.querySelector('.container').innerHTML = '<div class="error-box"><h2>Perfil não especificado.</h2><p>Verifique o endereço acessado.</p></div>';
    return;
  }

  const handle = rawHandle.trim().replace(/^@/, '');
  const data = await window.islySupabase.getProfileByHandle(handle);

  if (!data) {
    document.querySelector('.container').innerHTML = `<div class="error-box"><h2>404 — Universo não encontrado</h2><p>O perfil "@${handle}" ainda não foi publicado.</p></div>`;
    return;
  }

  // Contabiliza visualização
  let currentViews = (data.views_count || 0) + 1;
  document.getElementById('publicViewsCount').textContent = currentViews;
  try {
    await window.islySupabase.saveProfile({ id: data.id, views_count: currentViews });
  } catch (e) {
    console.warn("Analytics Error (Views):", e);
  }

  // Aplicação dinâmica das cores customizadas salvas pelo usuário
  document.body.style.backgroundColor = data.bg_color || '#080812';
  
  const card = document.getElementById('profileCard');
  if (card) {
    card.style.backgroundColor = data.card_bg || '#11111f';
    card.style.border = `1px solid ${data.border_color || '#a855f7'};`;
  }

  const nameEl = document.getElementById('name');
  if (nameEl) nameEl.style.color = data.title_color || '#ffffff';

  const bioEl = document.getElementById('bio');
  if (bioEl) bioEl.style.color = data.text_color || '#f6f4ff';

  const handleEl = document.getElementById('handle');
  if (handleEl) handleEl.style.color = data.accent_color || '#c084fc';

  document.getElementById('pageTitle').textContent = (data.name || handle) + ' — isly.me';
  nameEl.innerHTML = `${data.name || 'Sem nome'} <span class="verified">✦</span>`;
  handleEl.textContent = '@' + data.handle;
  
  const roleBadge = document.getElementById('roleBadge');
  if (roleBadge) {
    const r = data.role || 'Membro';
    if (r === 'Fundador') roleBadge.innerHTML = '💎 Fundador';
    else if (r === 'Suporte') roleBadge.innerHTML = '🛡️ Suporte';
    else if (r === 'Apoiador') roleBadge.innerHTML = '⭐ Apoiador';
    else roleBadge.innerHTML = '👾 Membro';
  }

  bioEl.textContent = data.bio || '';
  document.getElementById('statusEmoji').textContent = data.status_emoji || '🎮';
  document.getElementById('statusText').textContent = (data.status_label || 'Jogando') + (data.activity ? ' · ' + data.activity : '');

  const avatarEl = document.getElementById('avatar');
  if (data.avatar_url) {
    avatarEl.innerHTML = `<img src="${data.avatar_url}" alt="${data.name || 'Avatar'}">`;
  } else {
    avatarEl.textContent = data.avatar_emoji || '👾';
  }

  const emblemsEl = document.getElementById('emblems');
  if (emblemsEl) {
    emblemsEl.innerHTML = (data.emblems || []).map(id => {
      const info = emblemInfo[id];
      return info ? `<span>${info.emoji} ${info.name}</span>` : '';
    }).join('');
  }

  const linksEl = document.getElementById('links');
  if (linksEl) {
    const linkBg = data.link_bg || '#1c1b2d';
    const linkText = data.link_text_color || '#ffffff';
    const linkBorder = data.border_color || '#39324f';

    linksEl.innerHTML = (data.links || []).map((link, idx) => `
      <a class="public-link" data-url="${link.url || '#'}" target="_blank" rel="noopener" style="background:${linkBg}; color:${linkText}; border:1px solid ${linkBorder}">
        <span class="left"><span>${link.emoji || '↗'}</span><span>${link.title || 'Link'}</span></span>
        <span class="arr" style="color:${data.accent_color || '#c084fc'}">↗</span>
      </a>
    `).join('');

    document.querySelectorAll('.public-link').forEach(linkBtn => {
      linkBtn.addEventListener('click', async (evt) => {
        evt.preventDefault();
        const targetUrl = linkBtn.getAttribute('data-url');
        
        try {
          const currentClicks = (data.clicks_count || 0) + 1;
          await window.islySupabase.saveProfile({ id: data.id, clicks_count: currentClicks });
        } catch (e) {
          console.warn("Analytics Error (Clicks):", e);
        }

        if (targetUrl && targetUrl !== '#') {
          window.open(targetUrl, '_blank');
        }
      });
    });
  }
});
</script>
</body>
</html>
