<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080812">
<title id="pageTitle">isly.me — Perfil</title>
<!-- Tailwind CSS CDN para o player minimalista -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome Icons CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=JetBrains+Mono:wght@200;300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  if (typeof supabase === 'undefined') {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
  }
</script>
<style>
:root{color-scheme:dark;--bg:#080812;--panel:#11111f;--line:#292944;--text:#f6f4ff;--muted:#a6a4c4;--purple:#a855f7;--blue:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow-x:hidden;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.6;background:var(--bg);color:var(--text);user-select:none}

/* --- TELA DE ENTRADA (SPLASH SCREEN) --- */
.splash-overlay {
  position: fixed;
  inset: 0;
  background: #080812;
  z-index: 99999;
  display: grid;
  place-items: center;
  transition: opacity 0.5s ease, visibility 0.5s ease;
  cursor: pointer;
}
.splash-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.splash-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
}
.splash-star-wrapper {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: rgba(168, 85, 247, 0.08);
  border: 1px solid rgba(168, 85, 247, 0.3);
  display: grid;
  place-items: center;
  box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
  animation: splashPulse 2s infinite ease-in-out;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.splash-star-wrapper:hover {
  transform: scale(1.12);
  border-color: rgba(168, 85, 247, 0.9);
  box-shadow: 0 0 45px rgba(168, 85, 247, 0.6);
}
.splash-neon-star {
  width: 28px;
  height: 28px;
  fill: #ffffff;
  stroke: #ffffff;
  stroke-width: 1.5;
  filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
  transition: fill 0.2s ease, stroke 0.2s ease;
}
.splash-star-wrapper:hover .splash-neon-star {
  fill: #c084fc;
  stroke: #c084fc;
  filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.9));
}
.splash-text {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: #c9c5e2;
  text-transform: lowercase;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
}
@keyframes splashPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(168, 85, 247, 0.2); }
  50% { transform: scale(1.06); box-shadow: 0 0 40px rgba(168, 85, 247, 0.4); }
}

/* WRAPPER PRINCIPAL PARA POSICIONAR O CARD E OS POST-ITS AO LADO */
.page-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
}

.container{width:100%;max-width:640px;position:relative}

.profile-card{
  overflow: visible !important;
  border-radius:28px;
  width:100%;
  max-width:640px;
  margin:0 auto;
  box-shadow:0 24px 70px rgba(0,0,0,0.6);
  padding:36px;
  text-align:left;
  transform-style:preserve-3d;
  perspective:1200px;
  transition:transform 0.15s ease-out;
  background-size:cover;
  background-position:center;
  display:flex;
  flex-direction:column;
  gap:20px;
  border: none !important;
}

.card-style-opaque { background-color: #11111f; }
.card-style-glass {
  background: rgba(13, 11, 20, 0.25) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border: 1px solid rgba(255, 255, 255, 0.12) !important;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5) !important;
}
.profile-header-row {
  display: flex;
  align-items: center;
  gap: 18px;
  overflow: visible !important;
}

.avatar-container {
  position: relative;
  width: 76px;
  height: 76px;
  flex-shrink: 0;
  display: block;
}

.avatar {
  width: 100% !important;
  height: 100% !important;
  border-radius: 20px;
  background: linear-gradient(145deg, #8b5cf6, #4c1d95);
  overflow: hidden;
  position: relative;
  z-index: 1;
  display: block;
  padding: 0 !important;
  margin: 0 !important;
}

.avatar img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  display: block !important;
  border-radius: inherit !important;
}

.avatar-frame {
  position: absolute;
  inset: -6px;
  pointer-events: none;
  z-index: 2;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
.frame-neon-white { border: 2px solid #ffffff; border-radius: 22px; box-shadow: 0 0 12px rgba(255, 255, 255, 0.8), inset 0 0 8px rgba(255, 255, 255, 0.4); }
.frame-vip { border: 2px solid var(--purple); border-radius: 22px; box-shadow: 0 0 16px var(--purple), 0 0 30px var(--blue); }

.profile-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  overflow: visible !important;
}

.profile-card h3{
  margin:0 0 2px;
  font-size:24px;
  font-weight:800;
  letter-spacing:-0.01em;
  white-space:nowrap;
  overflow: visible !important;
  text-overflow: clip;
}

.text-effect-glow {
  color: #ffffff !important;
  text-shadow: 
    0 0 5px rgba(255, 255, 255, 0.9),
    0 0 10px rgba(255, 255, 255, 0.7),
    0 0 20px rgba(255, 255, 255, 0.5),
    0 0 35px rgba(255, 255, 255, 0.3);
}

.handle{font-size:13px;font-weight:600;letter-spacing:0.02em;margin-bottom:4px}
.role-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(139,92,246,0.15);border:1px solid rgba(139,92,246,0.35);color:#c084fc;width:fit-content}

.bio-preview{font-size:13px;margin:4px 0 0;overflow-wrap:anywhere;line-height:1.5}
.live-status{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid rgba(34,211,238,0.3);background:rgba(34,211,238,0.08);color:#cffafe;border-radius:999px;font-size:11px;font-weight:600;margin:4px 0 0;width:fit-content}

/* EMBLEMAS MINIMALISTAS E ENXUTOS */
.preview-emblems {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 4px;
}
.preview-emblems span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #e2dcf0;
  backdrop-filter: blur(8px);
  transition: all 0.2s ease;
}
.preview-emblems span:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.18);
  transform: translateY(-1px);
}

.public-socials{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.social-icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);text-decoration:none;transition:.2s}
.social-icon-btn svg{width:16px;height:16px;fill:currentColor}
.social-icon-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.08)}

.embeds-container{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.embed-wrapper{width:100%;border-radius:14px;overflow:hidden;background:#00000033;line-height:0}
.embed-wrapper iframe{width:100%;border:0;display:block}

.public-links{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.public-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-radius:14px;font-size:13px;font-weight:700;text-align:left;text-decoration:none;transition:all .25s ease;cursor:pointer;background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12)}
.public-link:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.4)}
.public-link .left{display:flex;align-items:center;gap:10px;min-width:0}
.public-link .left span:last-child{overflow:hidden;text-overflow:ellipsis}

/* FRIENDSHIPS - AMIGOS PRÓXIMOS */
.friendships-footer-wrapper {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.friendships-footer-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 700;
  color: var(--muted);
  cursor: default;
  transition: all 0.3s ease;
  width: fit-content;
}
.friendships-footer-title:hover {
  color: #ffffff;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(255, 255, 255, 0.4);
}
.friendships-footer-container {
  display: flex;
  align-items: center;
  gap: 12px;
}
.friendship-bubble {
  position: relative;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  display: block;
  transition: transform 0.2s ease, border-color 0.2s ease;
  text-decoration: none;
}
.friendship-bubble:hover {
  transform: scale(1.15);
  border-color: var(--purple);
  z-index: 10;
}
.friendship-bubble img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.friendship-bubble-fallback {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--text);
}

/* --- CONTADORES E HYPE --- */
.stats-container {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
  width: 100%;
}
.profile-card.align-center .stats-container { justify-content: center; }
.profile-card.align-left .stats-container { justify-content: flex-start; }

.views-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  color: #c9c5e2;
  font-weight: 600;
  font-size: 11px;
}

.hype-button {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 38px;
  padding: 0 14px 0 6px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
  transition: transform 0.15s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}

.hype-button:hover {
  transform: scale(1.02);
  border-color: rgba(255, 255, 255, 0.4);
  box-shadow: 0 0 14px rgba(255, 255, 255, 0.15);
}

.hype-button:active {
  transform: scale(0.96);
}

.hype-button.hyped {
  border-color: rgba(168, 85, 247, 0.6);
  background: rgba(168, 85, 247, 0.08);
}

.hype-button.hyped.animate-flash {
  animation: flashGlow 0.4s ease-out;
}

@keyframes flashGlow {
  0% {
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.3);
    border-color: #ffffff;
  }
  100% {
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
  }
}

.icon-wrapper {
  position: relative;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.04);
}

.neon-star {
  width: 14px;
  height: 14px;
  fill: #FFFFFF;
  stroke: #FFFFFF;
  stroke-width: 1.5;
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.hype-button.hyped .neon-star {
  fill: #c084fc;
  stroke: #c084fc;
  transform: scale(1.2);
  filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.8));
}

.hype-count {
  color: #ffffff;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.particle {
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 6px #ffffff;
  animation: explode 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}

@keyframes explode {
  0% { opacity: 1; transform: translate(0, 0) scale(1); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
}

.profile-foot{font-size:10px;color:#777391;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;padding:14px 0 18px;text-align:center;border-top:1px solid rgba(255,255,255,0.08);margin-top:6px}
.error-box{text-align:center;padding:30px;color:#fcd9a1}

/* --- POST-ITS FIXOS NA LATERAL DIREITA --- */
.guestbook-sidebar-fixed {
  position: absolute;
  left: calc(100% + 24px);
  top: 20px;
  width: 230px;
  display: flex;
  flex-direction: column;
  pointer-events: none;
  z-index: 99;
}
.guestbook-sidebar-fixed * {
  pointer-events: auto;
}
.scrap-paper-stack {
  position: relative;
  background: #f4ebd0;
  color: #2c251d;
  padding: 12px 14px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 11px;
  line-height: 1.4;
  box-shadow: 2px 4px 12px rgba(0,0,0,0.4);
  border: 1px dashed #d1c29e;
  clip-path: polygon(0% 4%, 3% 0%, 97% 2%, 100% 6%, 98% 95%, 100% 100%, 2% 97%, 0% 94%);
  transition: transform 0.2s ease, z-index 0.2s;
  margin-top: -18px; 
}
.scrap-paper-stack:first-child {
  margin-top: 0;
}
.scrap-paper-stack:hover {
  transform: scale(1.04) rotate(0deg) !important;
  z-index: 50;
  box-shadow: 4px 8px 18px rgba(0,0,0,0.5);
}

/* --- BOTÃO DISCRETO NO CANTO INFERIOR ESQUERDO --- */
.guestbook-trigger-btn {
  position: fixed;
  bottom: 24px;
  left: 24px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--muted);
  padding: 8px 14px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  z-index: 999;
  backdrop-filter: blur(8px);
  transition: all 0.2s ease;
  letter-spacing: 0.3px;
}
.guestbook-trigger-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.2);
}

/* --- MODAL VINTAGE DE ENVIO --- */
.guestbook-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 8, 18, 0.8);
  backdrop-filter: blur(8px);
  display: grid;
  place-items: center;
  z-index: 10000;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.guestbook-modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.guestbook-modal-content {
  background: #14111c;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  width: 100%;
  max-width: 400px;
  padding: 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.scrap-form textarea {
  width: 100%;
  background: #0a0812;
  border: 1px solid #352f4a;
  border-radius: 10px;
  color: #f6f4ff;
  padding: 10px;
  font-size: 12px;
  resize: none;
  height: 70px;
  outline: none;
}
.scrap-form textarea:focus { border-color: var(--purple); }
.scrap-submit-btn {
  width: 100%;
  margin-top: 8px;
  background: linear-gradient(135deg, #7c3aed, #9333ea);
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 9px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.scrap-submit-btn:hover { opacity: 0.9; }

@media(max-width: 1020px) {
  .page-wrapper { flex-direction: column; }
  .guestbook-sidebar-fixed {
    position: static;
    width: 100%;
    margin-top: 24px;
  }
  .scrap-paper-stack { margin-top: 8px !important; }
}

/* PLAYER ULTRA MINIMALISTA (FIXO NO TOPO) */
.glow-border {
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.03), inset 0 0 15px rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.glow-btn {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.glow-btn:hover {
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
  transform: scale(1.05);
}
.glow-btn:active {
  transform: scale(0.95);
}

.animate-item { opacity: 0; transform: translateY(16px); animation: cascadeIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes cascadeIn { to { opacity: 1; transform: translateY(0); } }
.delay-1 { animation-delay: 0.05s; }
.delay-2 { animation-delay: 0.12s; }
.delay-3 { animation-delay: 0.18s; }
.delay-4 { animation-delay: 0.24s; }
.delay-5 { animation-delay: 0.30s; }
.delay-6 { animation-delay: 0.36s; }
.delay-7 { animation-delay: 0.42s; }
.delay-8 { animation-delay: 0.48s; }
</style>
</head>
<body>

<!-- PLAYER ULTRA MINIMALISTA (FIXO NO CANTO INFERIOR ESQUERDO) -->
<header class="fixed bottom-6 left-6 z-50 w-[280px] max-w-[90vw]">
    <div id="playerWrapper" class="glow-border bg-[#09090b]/90 rounded-full px-3 py-1.5 flex items-center justify-between transition-all duration-500 shadow-2xl">
        
        <!-- Botão Play/Pause -->
        <button id="playPauseBtn" class="player-btn-action glow-btn relative w-7 h-7 rounded-full bg-white text-black flex items-center justify-center focus:outline-none cursor-pointer">
            <i id="playIcon" class="fa-solid fa-play text-[9px] translate-x-[1px]"></i>
            <i id="pauseIcon" class="fa-solid fa-pause text-[9px] hidden"></i>
        </button>

        <!-- Status / Nome da Trilha / Canvas -->
        <div class="flex flex-col items-center justify-center flex-1 mx-2.5 overflow-hidden">
            <div class="flex items-center gap-1 mb-0.5 w-full justify-center">
                <span id="trackStatus" class="inline-block w-1.5 h-1.5 rounded-full bg-neutral-600 transition-colors duration-300"></span>
                <span id="trackTitle" class="player-text-title text-[10px] font-mono tracking-wider uppercase text-neutral-400 truncate max-w-[100px]">
                    SOUNDTRACK
                </span>
            </div>
            <!-- Canvas do Visualizador -->
            <div class="w-full flex items-center justify-center h-2">
                <canvas id="visualizer" class="w-full h-full opacity-70"></canvas>
            </div>
        </div>

        <!-- Tempo / Mute -->
        <div class="player-text-meta flex items-center gap-2 text-neutral-400">
            <span id="timeDisplay" class="text-[9px] font-mono tracking-tighter text-neutral-500">00:00</span>
            <button id="muteBtn" class="hover:text-white transition-colors duration-200 focus:outline-none cursor-pointer">
                <i id="volumeIcon" class="fa-solid fa-volume-high text-[10px]"></i>
            </button>
        </div>

        <!-- Player oculto do YouTube (Invisível) -->
        <div id="youtubePlayerContainer" style="display:none; position:absolute; pointer-events:none; opacity:0; width:0; height:0; overflow:hidden;"></div>
    </div>
</header>

<!-- TELA DE ENTRADA (SPLASH SCREEN) -->
<div class="splash-overlay" id="splashScreen">
  <div class="splash-content">
    <div class="splash-star-wrapper" id="splashStarBtn">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="splash-neon-star">
        <path d="M24 10L26.7634 19.4674L33.7128 20.1456L28.4724 24.8454L30.043 31.6786L24 28.02L17.957 31.6786L19.5276 24.8454L14.2872 20.1456L21.2366 19.4674L24 10Z" />
      </svg>
    </div>
    <div class="splash-text" id="splashTextDisplay">clica aê</div>
  </div>
</div>

<div class="page-wrapper">
  <div class="container">
    <div class="profile-card card-style-opaque" id="profileCard">
      <div class="profile-header-row animate-item delay-1">
        <div class="avatar-container">
          <div class="avatar" id="avatar">⌬</div>
          <div id="avatarFrame" class="avatar-frame"></div>
        </div>

function getSpotifyEmbed(url) {
  if (!url) return '';
  const match = url.match(/spotify\.com\/(track|album|playlist|artist)\/([a-zA-Z0-9]+)/);
  if (match) {
    return `<div class="embed-wrapper"><iframe src="https://open.spotify.com/embed/${match[1]}/${match[2]}?utm_source=generator&theme=0" height="80" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>`;
  }
  return '';
}

function getYoutubeEmbed(url) {
  if (!url) return '';
  let id = '';
  if (url.includes('v=')) id = url.split('v=')[1]?.split('&')[0];
  else if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1]?.split('?')[0];
  if (id) {
    return `<div class="embed-wrapper"><iframe src="https://www.youtube.com/embed/${id}" height="180" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  }
  return '';
}

function getInstagramEmbed(url) {
  if (!url) return '';
  const match = url.match(/instagram\.com\/(p|reel)\/([a-zA-Z0-9_-]+)/);
  if (match) {
    return `<div class="embed-wrapper"><iframe src="https://www.instagram.com/${match[1]}/${match[2]}/embed" height="360" frameborder="0" scrolling="no" allowtransparency="true"></iframe></div>`;
  }
  return '';
}

// Função auxiliar para extrair o ID do YouTube da Trilha Sonora
function getYoutubeAudioId(url) {
  if (!url) return null;
  let id = '';
  if (url.includes('v=')) id = url.split('v=')[1]?.split('&')[0];
  else if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1]?.split('?')[0];
  else if (url.includes('embed/')) id = url.split('embed/')[1]?.split('?')[0];
  return id || url;
}

let ytPlayer = null;
let isYtPlaying = false;

document.addEventListener("DOMContentLoaded", async () => {
 const urlParams = new URLSearchParams(window.location.search);
  let rawHandle = urlParams.get('u') || urlParams.get('user');

  if (!rawHandle) {
    const pathSegments = window.location.pathname.split('-');
    if (pathSegments.length > 1 && window.location.pathname.startsWith('/sly-')) {
      rawHandle = pathSegments[pathSegments.length - 1];
    }
  }

  if (!rawHandle || !window.islySupabase) {
    document.querySelector('.container').innerHTML = '<div class="error-box"><h2>Perfil não especificado.</h2><p>Verifique o endereço acessado.</p></div>';
    return;
  }

  const handle = rawHandle.trim().replace(/^@/, '');
  const data = await window.islySupabase.getProfileByHandle(handle);

  if (!data) {
    document.querySelector('.container').innerHTML = `<div class="error-box"><h2>404 — Universo não encontrado</h2><p>O perfil "@${handle}" ainda não foi publicado.</p></div>`;
    return;
  }

  if (data.is_banned) {
    document.querySelector('.container').innerHTML = `
      <div class="error-box" style="border: 1px solid #f8717144; background: #f8717112; border-radius: 18px; padding: 40px;">
        <h2>⚠️ Conta Suspensa</h2>
        <p>Este perfil foi suspenso por violação dos termos de uso da comunidade.</p>
      </div>
    `;
    return;
  }

  let currentViews = (data.views_count || 0) + 1;
  document.getElementById('publicViewsCount').textContent = currentViews;
  try {
    await window.islySupabase.saveProfile({ id: data.id, views_count: currentViews });
  } catch (e) {
    console.warn("Analytics Error:", e);
  }

  const hypeCountEl = document.getElementById('hypeCount');
  if (hypeCountEl) {
    hypeCountEl.textContent = data.hypes || 0;
  }

  const statsContainer = document.getElementById('statsContainer');
  const alignment = data.card_alignment || 'center';
  if (statsContainer) {
    statsContainer.classList.remove('align-center', 'align-left');
    statsContainer.classList.add('align-' + alignment);
  }

  document.body.style.backgroundColor = data.bg_color || '#080812';
  if (data.custom_cursor) {
    document.body.style.cursor = `url('${data.custom_cursor}'), auto`;
  }

  const card = document.getElementById('profileCard');
  if (card) {
    const cardStyleType = data.card_style || 'opaque';
    card.classList.remove('card-style-opaque', 'card-style-glass');
    
    if (cardStyleType === 'glass') {
      card.classList.add('card-style-glass');
      card.style.backgroundColor = '';
    } else {
      card.classList.add('card-style-opaque');
      card.style.backgroundColor = data.card_bg || '#11111f';
    }

    if (data.wallpaper_url) {
      document.body.style.backgroundImage = `linear-gradient(rgba(8, 8, 18, 0.75), rgba(8, 8, 18, 0.75)), url('${data.wallpaper_url}')`;
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundRepeat = 'no-repeat';
      document.body.style.backgroundAttachment = 'fixed';
    }

    card.style.border = 'none';

    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const xc = rect.width / 2;
      const yc = rect.height / 2;
      const dx = (x - xc) / xc;
      const dy = (y - yc) / yc;
      card.style.transform = `perspective(1200px) rotateY(${dx * 4}deg) rotateX(${-dy * 4}deg) translateY(-2px)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1200px) rotateY(0deg) rotateX(0deg) translateY(0px)';
    });
  }

  const nameEl = document.getElementById('name');
  if (nameEl) {
    nameEl.style.color = data.title_color || '#ffffff';
    if (data.name_effect === 'glow') {
      nameEl.classList.add('text-effect-glow');
    }
  }

  const activeTextColor = data.text_color || '#f6f4ff';
  const bioEl = document.getElementById('bio');
  if (bioEl) bioEl.style.color = activeTextColor;

  const handleEl = document.getElementById('handle');
  if (handleEl) handleEl.style.color = activeTextColor;

  document.getElementById('pageTitle').textContent = (data.name || handle) + ' — isly.me';
  nameEl.textContent = data.name || 'Sem nome';
  handleEl.textContent = '@' + data.handle;

  const roleBadge = document.getElementById('roleBadge');
  if (roleBadge) {
    const r = data.role || 'Membro';
    roleBadge.innerHTML = r === 'Fundador' ? '💎 Fundador' : r === 'Suporte' ? '🛡️ Suporte' : r === 'Apoiador' ? '⭐ Apoiador' : '👾 Membro';
  }

  bioEl.textContent = data.bio || '';
  document.getElementById('statusEmoji').textContent = data.status_emoji || '🎮';
  document.getElementById('statusText').textContent = (data.status_label || 'Jogando') + (data.activity ? ' · ' + data.activity : '');

  const avatarEl = document.getElementById('avatar');
  if (data.avatar_url) {
    avatarEl.innerHTML = `<img src="${data.avatar_url}" alt="${data.name || 'Avatar'}">`;
  } else {
    avatarEl.textContent = '⌬';
  }

  const frameEl = document.getElementById('avatarFrame');
  const frameType = data.avatar_frame || 'none';
  frameEl.className = 'avatar-frame';
  if (frameType === 'neon-white') frameEl.classList.add('frame-neon-white');
  else if (frameType === 'vip') frameEl.classList.add('frame-vip');

  const emblemsEl = document.getElementById('emblems');
  if (emblemsEl) {
    emblemsEl.innerHTML = (data.emblems || []).map(id => {
      const cleanId = String(id).toLowerCase().trim();
      const emoji = emblemEmojis[cleanId] || '✨';
      const name = emblemNames[cleanId] || cleanId;
      return `<span><span style="font-size: 12px; line-height: 1;">${emoji}</span>${name}</span>`;
    }).join('');
  }

  const socialsBar = document.getElementById('socialsBar');
  if (socialsBar && data.socials) {
    let sHTML = '';
    Object.keys(data.socials).forEach(key => {
      const val = data.socials[key];
      if (val && socialUrls[key]) {
        const url = socialUrls[key](val);
        const svg = socialSvgs[key] || '';
        sHTML += `<a class="social-icon-btn" href="${url}" target="_blank" rel="noopener" title="${key}" style="color:${activeTextColor}">${svg}</a>`;
      }
    });
    socialsBar.innerHTML = sHTML;
  }

  const embedsBar = document.getElementById('embedsBar');
  if (embedsBar) {
    let eHTML = '';
    eHTML += getSpotifyEmbed(data.embed_spotify);
    eHTML += getYoutubeEmbed(data.embed_youtube);
    eHTML += getInstagramEmbed(data.embed_instagram);
    embedsBar.innerHTML = eHTML;
  }

  const linksEl = document.getElementById('links');
  if (linksEl) {
    linksEl.innerHTML = (data.links || []).map(link => `
      <a class="public-link" data-url="${link.url || '#'}" target="_blank" rel="noopener" style="background:rgba(255,255,255,0.06); color:${activeTextColor}; border:1px solid rgba(255,255,255,0.12); backdrop-filter:blur(12px)">
        <span class="left"><span>${link.emoji || '↗'}</span><span>${link.title || 'Link'}</span></span>
        <span class="arr" style="color:${activeTextColor}">↗</span>
      </a>
    `).join('');

    document.querySelectorAll('.public-link').forEach(linkBtn => {
      linkBtn.addEventListener('click', async (evt) => {
        evt.preventDefault();
        const targetUrl = linkBtn.getAttribute('data-url');
        try {
          const currentClicks = (data.clicks_count || 0) + 1;
          await window.islySupabase.saveProfile({ id: data.id, clicks_count: currentClicks });
        } catch (e) {
          console.warn("Analytics Error:", e);
        }
        if (targetUrl && targetUrl !== '#') window.open(targetUrl, '_blank');
      });
    });
  }

  // --- LÓGICA DA SPLASH SCREEN & PLAYER YOUTUBE ---
  const splashScreen = document.getElementById('splashScreen');
  const splashTextDisplay = document.getElementById('splashTextDisplay');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const trackStatus = document.getElementById('trackStatus');
  const timeDisplay = document.getElementById('timeDisplay');
  const muteBtn = document.getElementById('muteBtn');
  const volumeIcon = document.getElementById('volumeIcon');

  if (splashTextDisplay) {
    splashTextDisplay.textContent = data.splash_text || 'clica aê';
  }

  // Inicialização do YouTube Iframe API para o player oculto
  if (data.soundtrack) {
    const ytId = getYoutubeAudioId(data.soundtrack);
    if (ytId) {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);

      window.onYouTubeIframeAPIReady = function() {
        ytPlayer = new YT.Player('youtubePlayerContainer', {
          height: '0',
          width: '0',
          videoId: ytId,
          playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': ytId },
          events: {
            'onStateChange': onPlayerStateChange
          }
        });
      };
    }
  }

  function onPlayerStateChange(event) {
    if (event.data == YT.PlayerState.PLAYING) {
      updatePlayerUI(true);
      isYtPlaying = true;
    } else {
      updatePlayerUI(false);
      isYtPlaying = false;
    }
  }

  function updatePlayerUI(isPlaying) {
    if (isPlaying) {
      playIcon.classList.add('hidden');
      pauseIcon.classList.remove('hidden');
      trackStatus.classList.remove('bg-neutral-600');
      trackStatus.classList.add('bg-white', 'shadow-[0_0_8px_#fff]');
    } else {
      playIcon.classList.remove('hidden');
      pauseIcon.classList.add('hidden');
      trackStatus.classList.remove('bg-white', 'shadow-[0_0_8px_#fff]');
      trackStatus.classList.add('bg-neutral-600');
    }
  }

  function togglePlayAudio() {
    if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }
  }

  if (playPauseBtn) {
    playPauseBtn.addEventListener('click', togglePlayAudio);
  }

  // Mute / Unmute
  if (muteBtn && ytPlayer) {
    let isMuted = false;
    muteBtn.addEventListener('click', () => {
      if (isMuted) {
        ytPlayer.unMute();
        volumeIcon.className = 'fa-solid fa-volume-high text-[11px] text-neutral-400';
        isMuted = false;
      } else {
        ytPlayer.mute();
        volumeIcon.className = 'fa-solid fa-volume-xmark text-[11px] text-neutral-600';
        isMuted = true;
      }
    });
  }

  // Relógio do tempo percorrido
  setInterval(() => {
    if (ytPlayer && isYtPlaying && typeof ytPlayer.getCurrentTime === 'function') {
      const currentTime = ytPlayer.getCurrentTime();
      const minutes = Math.floor(currentTime / 60);
      const seconds = Math.floor(currentTime % 60);
      if (timeDisplay) {
        timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }
    }
  }, 1000);

  // Clique na Splash Screen
  if (splashScreen) {
    splashScreen.addEventListener('click', () => {
      splashScreen.classList.add('hidden');
      
      // Função para tentar iniciar o vídeo com segurança
      const tryPlay = () => {
        if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
          try {
            ytPlayer.playVideo();
          } catch (e) {
            console.warn("Tentativa de autoplay falhou, tentando novamente...", e);
            setTimeout(tryPlay, 300);
          }
        } else {
          // Se o player ainda estiver carregando a API, tenta de novo em 300ms
          setTimeout(tryPlay, 300);
        }
      };
      
      tryPlay();
    });
  }

  // Canvas Visualizador Minimalista
  const canvas = document.getElementById('visualizer');
  const ctx = canvas ? canvas.getContext('2d') : null;

  function resizeCanvas() {
    if (canvas) {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    if (!canvas || !ctx) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const bars = 20;
    const barWidth = 2;
    const gap = (canvas.width - (bars * barWidth)) / (bars - 1);

    for (let i = 0; i < bars; i++) {
      let barHeight = 2;

      if (isYtPlaying) {
        const randomFactor = Math.sin(Date.now() / 150 + i) * 0.5 + 0.5;
        barHeight = Math.max(4, randomFactor * canvas.height * 0.8);
      }

      const x = i * (barWidth + gap);
      const y = (canvas.height - barHeight) / 2;

      ctx.fillStyle = isYtPlaying ? 'rgba(255, 255, 255, 0.85)' : 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(x, y, barWidth, barHeight);
    }
  }
  drawVisualizer();

  // Lógica do Botão Hype
  const hypeBtn = document.getElementById('hypeBtn');
  const iconWrapper = document.getElementById('iconWrapper');

  if (hypeBtn && hypeCountEl && iconWrapper) {
    const storageKey = `isly_hyped_${data.id || handle}`;
    
    if (localStorage.getItem(storageKey) === 'true') {
      hypeBtn.classList.add('hyped');
    }

    hypeBtn.addEventListener('click', async () => {
      if (localStorage.getItem(storageKey) === 'true') {
        return; 
      }

      let current = parseInt(hypeCountEl.innerText, 10) || 0;
      let newCount = current + 1;
      
      localStorage.setItem(storageKey, 'true');
      hypeBtn.classList.add('hyped', 'animate-flash');

      hypeCountEl.innerText = newCount;
      createNeonBurst(iconWrapper);

      try {
        if (window.islySupabase && typeof window.islySupabase.incrementHype === 'function') {
          await window.islySupabase.incrementHype(data.id, current);
        } else {
          await window.islySupabase.saveProfile({ id: data.id, hypes: newCount });
        }
      } catch (err) {
        console.warn("Erro ao salvar hype:", err);
      }
    });
  }

  function createNeonBurst(targetContainer) {
    const particleCount = 10; 
    const rect = targetContainer.getBoundingClientRect();
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('span');
      particle.classList.add('particle');

      const size = Math.random() * 2 + 2;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${centerX}px`;
      particle.style.top = `${centerY}px`;

      const angle = Math.random() * Math.PI * 2;
      const velocity = Math.random() * 30 + 15;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity;

      particle.style.setProperty('--tx', `${tx}px`);
      particle.style.setProperty('--ty', `${ty}px`);

      targetContainer.appendChild(particle);
      setTimeout(() => particle.remove(), 500);
    }
  }
});
</script>
</body>
</html>
