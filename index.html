<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080812">
<meta name="description" content="ISLY.ME — sua identidade digital gamer e geek">
<title>Painel de edição — ISLY.ME</title>
<style>
:root{color-scheme:dark;--bg:#080812;--panel:#11111f;--panel2:#17172a;--line:#292944;--text:#f6f4ff;--muted:#a6a4c4;--purple:#a855f7;--blue:#22d3ee;--pink:#f472b6;--green:#86efac}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.6}
button,input,textarea,select{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{color:inherit;cursor:pointer}
.wrap{width:min(1180px,calc(100% - 32px));margin:auto}
.topbar{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #a78bfa22}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:850;letter-spacing:-1px}
.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--blue));color:#080812;font-size:18px}
.dot{color:var(--blue)}
.actions{display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--line);border-radius:12px;padding:11px 16px;background:#ffffff08;color:var(--text);font-size:13px;font-weight:750}
.btn.primary{border:0;background:linear-gradient(110deg,#7c3aed,#9333ea 55%,#2563eb)}
.sync-badge{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:20px;background:#ffffff05;border:1px solid #292944}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block;transition:background 0.3s}
.sync-dot.saving{background:#facc15;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:0.4}50%{opacity:1}100%{opacity:0.4}}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding:30px 0 60px}
.sidebar,.panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#141422,#0d0d18)}
.sidebar{align-self:start;padding:14px;position:sticky;top:20px}
.side-title{padding:10px;font-size:11px;letter-spacing:2px;color:#8582a5;text-transform:uppercase;font-weight:700}
.navbtn{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:12px 14px;color:#c9c5e2;font-size:13px;font-weight:600;margin-bottom:6px}
.navbtn:hover,.navbtn.active{background:#8b5cf619;border-color:#8b5cf63b;color:white}
.side-note{border-top:1px solid var(--line);padding:14px 10px 6px;color:#8582a5;font-size:11px;line-height:1.7}
.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:2px;color:#c084fc;text-transform:uppercase;font-weight:800}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-1.5px;margin:8px 0}
.heading p,.muted{font-size:13px;color:var(--muted)}
.pill{font-size:11px;border:1px solid #86efac40;border-radius:30px;padding:8px 12px;color:#bbf7d0;white-space:nowrap;font-weight:600}

.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.stat-card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#16162a,#0f0f1c);padding:16px 18px;display:flex;align-items:center;gap:14px}
.stat-icon{width:42px;height:42px;border-radius:12px;background:#8b5cf618;border:1px solid #8b5cf633;display:grid;place-items:center;font-size:20px;color:#c084fc}
.stat-val{font-size:22px;font-weight:850;line-height:1;margin-bottom:4px}
.stat-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}

.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.85fr);gap:20px;align-items:start}
.panel{padding:20px;margin-bottom:16px;min-width:0;display:none}
.panel.active-panel{display:block}
.panel h2{font-size:16px;margin:0;font-weight:750}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.panel-head p{font-size:12px;color:var(--muted);margin:4px 0 0}
.field{display:block;margin:15px 0}
.field>span{display:block;font-size:12px;color:#c7c4dd;margin-bottom:7px;font-weight:700}
.field input, .field textarea, .field select{width:100%;min-width:0;border:1px solid #35334e;border-radius:11px;padding:12px 14px;background:#0a0a14;color:white;font-size:13px;outline:none}
.field input[type="color"]{height:48px;padding:5px;cursor:pointer;appearance:none;-webkit-appearance:none;border:1px solid #35313f;border-radius:12px;background:#100e15;box-shadow:none;overflow:hidden}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--purple)}
.field small,.hint{display:block;color:#8582a5;font-size:11px;line-height:1.7;margin-top:7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.options{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid #35334e;background:#ffffff05;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;cursor:pointer}
.choice.active{border-color:var(--blue);background:#22d3ee13;color:#cffafe}
.emblems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.emblem{border:1px solid #35334e;border-radius:12px;background:#ffffff04;padding:12px 8px;text-align:center;font-size:12px;font-weight:600;cursor:pointer}
.emblem.selected{border-color:var(--purple);background:#a855f712}
.emblem svg{width:26px;height:26px;margin:0 auto 6px;display:block;fill:currentColor}

.social-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.link-row{display:grid;grid-template-columns:auto 42px 1fr 1fr auto;gap:8px;margin:10px 0;align-items:center}
.link-row input{min-width:0;width:100%;border:1px solid #35334e;border-radius:10px;padding:10px 12px;background:#0a0a14;color:white;font-size:12px}
.reorder-btns{display:flex;flex-direction:column;gap:3px}
.reorder-btn{border:1px solid #35334e;border-radius:6px;background:#ffffff05;color:#c9c5e2;padding:3px 6px;font-size:10px;cursor:pointer}
.reorder-btn:disabled{opacity:0.2;cursor:not-allowed}
.remove{border:1px solid #52313f;border-radius:9px;background:#ffffff05;color:#fda4af;padding:9px 12px;cursor:pointer}
.add{width:100%;border:1px dashed #514174;border-radius:11px;background:#8b5cf609;color:#d8b4fe;padding:12px;font-size:12px;font-weight:750;cursor:pointer}

.preview{position:sticky;top:20px}
.preview-label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:14px}

.profile-card {
  position:relative;
  isolation:isolate;
  overflow:visible!important;
  width:100%;
  max-width:680px;
  min-width:0;
  margin:0 auto;
  display:grid;
  grid-template-columns:minmax(132px,.72fr) minmax(0,1.28fr);
  grid-template-rows:auto;
  align-items:start;
  gap:12px 22px;
  padding:27px;
  border:1px solid #a78bfa2b!important;
  border-radius:23px;
  background-color:#13101a;
  background-image:
    radial-gradient(ellipse at 10% 0%,#8b5cf61b,transparent 55%),
    linear-gradient(145deg,#17131f,#0f0c14);
  background-size: cover;
  background-position: center;
  box-shadow:0 24px 70px #00000055,0 0 0 1px #ffffff04,inset 0 1px #ffffff0a;
  text-align:left;
  transform-style:preserve-3d;
  perspective:1200px;
  transition:transform 0.15s ease-out, border-color .2s, box-shadow .2s;
}
.profile-card:before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(125deg,#ffffff06,transparent 35%,#8b5cf608);
}
.card-style-opaque{background-color:#13101a}
.card-style-glass {
  background: rgba(13, 11, 20, 0.25) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border: 1px solid rgba(255, 255, 255, 0.12) !important;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5) !important;
}
.profile-header-row{
  grid-column:1;grid-row:1 / span 7;display:flex;flex-direction:column;
  align-items:flex-start;gap:14px;min-width:0;padding:3px 0 0;
  overflow:visible!important
}
.avatar-container{
  position: relative;
  width: 76px;
  height: 76px;
  flex-shrink: 0;
  display: block;
}

.avatar {
  width: 100% !important;
  height: 100% !important;
  border-radius: 20px;
  background: linear-gradient(145deg, #8b5cf6, #4c1d95);
  overflow: hidden;
  position: relative;
  z-index: 1;
  display: block;
  padding: 0 !important;
  margin: 0 !important;
}

.avatar img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  display: block !important;
  border-radius: inherit !important;
}

.avatar-frame {
  position: absolute;
  inset: -6px;
  pointer-events: none;
  z-index: 2;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
.frame-cyberpunk{border:2px solid var(--blue);border-radius:22px;box-shadow:0 0 12px var(--blue)}
.frame-neon-gold{border:2px solid #c4
