
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080812">
<title>Redefinir senha — isly.me</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
if (typeof supabase === 'undefined') {
  document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
}
</script>

<style>
:root{color-scheme:dark;--bg:#080812;--line:#292944;--text:#f6f4ff;--muted:#a6a4c4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,rgba(124,58,237,.28),transparent 45%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}
a{color:#c4b5fd;text-decoration:none}
.box{width:min(440px,100%);border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#141422,#0d0d18);padding:30px;box-shadow:0 20px 50px #0008}
.brand{font-size:24px;font-weight:850;letter-spacing:-1.3px;margin-bottom:24px}
.brand span{color:#22d3ee}
h1{font-size:23px;margin:0 0 8px}
p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 22px}
label{display:block;font-size:12px;color:#c7c4dd;margin-bottom:7px;font-weight:650}
.field{margin-bottom:17px}
input{width:100%;border:1px solid #35334e;border-radius:11px;padding:13px 14px;background:#0a0a14;color:#fff;outline:none;font-size:14px}
input:focus{border-color:#a855f7;box-shadow:0 0 0 3px #a855f71b}
button{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(105deg,#7c3aed,#9333ea 58%,#2563eb);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
#message{margin-top:16px;font-size:13px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="box">
  <div class="brand">⌬ isly<span>.me</span></div>
  <h1>Crie uma nova senha</h1>
  <p>Escolha uma nova senha para voltar ao seu universo ISLY.ME.</p>

  <form id="resetForm">
    <div class="field">
      <label for="newPassword">Nova senha</label>
      <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Pelo menos 8 caracteres">
    </div>
    <div class="field">
      <label for="confirmPassword">Confirme a nova senha</label>
      <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Digite novamente">
    </div>
    <button type="submit" id="saveButton">Salvar nova senha</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
  <p><a href="landing.html">Voltar para o acesso</a></p>
</main>

<script src="/js/supabase.js"></script>
<script>
document.getElementById('resetForm').addEventListener('submit', async event => {
  event.preventDefault();

  const button = document.getElementById('saveButton');
  const message = document.getElementById('message');
  const password = document.getElementById('newPassword').value;
  const confirmation = document.getElementById('confirmPassword').value;

  if (password.length < 8) {
    message.textContent = 'A senha precisa ter pelo menos 8 caracteres.';
    return;
  }

  if (password !== confirmation) {
    message.textContent = 'As senhas não são iguais.';
    return;
  }

  button.disabled = true;
  button.textContent = 'Salvando...';
  message.textContent = '';

  try {
    let ready = false;

    for (let i = 0; i < 30; i++) {
      if (window.islySupabase) {
        ready = true;
        break;
      }
      await new Promise(resolve => setTimeout(resolve, 100));
    }

    if (!ready) {
      message.textContent = 'Não foi possível carregar o módulo de acesso. Atualize a página.';
      return;
    }

    const result = await window.islySupabase.updatePassword(password);

    if (result.error) {
      message.textContent = result.error;
      return;
    }

    message.textContent = 'Senha alterada com sucesso! Redirecionando para o ISLY.ME...';
    setTimeout(() => window.location.replace('index.html'), 1500);
  } catch (error) {
    console.error(error);
    message.textContent = 'Não foi possível alterar a senha. Solicite um novo link de recuperação.';
  } finally {
    button.disabled = false;
    button.textContent = 'Salvar nova senha';
  }
});
</script>
</body>
</html>
